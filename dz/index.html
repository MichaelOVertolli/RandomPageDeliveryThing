<script type="module">
// Stratified sample with largest-remainder rounding.
// Filters `cards` to categories in `selectedCategories`, then picks counts
// per category proportional to availability. Caps at per-category supply
// and at total availability. Tie-breaks on equal remainders by the order
// each category appears in `selectedCategories`.
export function stratifiedSample(cards, n, selectedCategories) {
  if (n === 0 || selectedCategories.length === 0) return [];

  const selected = new Set(selectedCategories);
  const filtered = cards.filter((c) => selected.has(c.category));
  if (filtered.length === 0) return [];

  const byCat = new Map();
  for (const cat of selectedCategories) byCat.set(cat, []);
  for (const c of filtered) byCat.get(c.category).push(c);

  const total = filtered.length;
  const effectiveN = Math.min(n, total);

  const entries = [];
  for (const [cat, list] of byCat) {
    if (list.length === 0) continue;
    const raw = (list.length / total) * effectiveN;
    const quota = Math.floor(raw);
    entries.push({ cat, list, quota, remainder: raw - quota });
  }

  let leftover =
    effectiveN - entries.reduce((sum, e) => sum + e.quota, 0);

  const order = entries
    .map((_, i) => i)
    .sort(
      (a, b) =>
        entries[b].remainder - entries[a].remainder || a - b,
    );

  for (const i of order) {
    if (leftover <= 0) break;
    if (entries[i].quota < entries[i].list.length) {
      entries[i].quota += 1;
      leftover -= 1;
    }
  }

  const out = [];
  for (const e of entries) {
    out.push(...e.list.slice(0, e.quota));
  }
  return out;
}

// Tallies a list of {category, correct} results into total + per-category counts.
export function scoreSummary(results) {
  const byCategory = {};
  let totalCorrect = 0;
  for (const r of results) {
    const slot = byCategory[r.category] || { correct: 0, total: 0 };
    slot.total += 1;
    if (r.correct) {
      slot.correct += 1;
      totalCorrect += 1;
    }
    byCategory[r.category] = slot;
  }
  return {
    total: { correct: totalCorrect, total: results.length },
    byCategory,
  };
}

// Fisher-Yates shuffle. Returns a new array; does not mutate input.
// `rng` must be a function returning a number in [0, 1).
export function shuffle(arr, rng) {
  const out = [...arr];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

answer": "Check glass and mirrors. Touch everything including the seal on the glass (full 360).\nThen say, if required mirror or glass has broken or damaged attachments (minor)", "category": "EXT", "media": null}, {"id": "0020", "question": "Brake fluid level is below indicated minimum level", "answer": "Not applicable > air brake\nVerbalize minor and major", "category": "EXT", "media": null}, {"id": "0021", "question": "Air leak in suspension system", "answer": "Not applicable > spring leaf suspension\nVerbalize minor and major", "category": "EXT", "media": null}, {"id": "0022", "question": "A broken spring leaf", "answer": "Check in engine to see if any of the non-main spring leafs are broken/cracked.\nThen, check if the main spring leaf is broken/cracked or more than one spring leaf in any spring assembly is broken/cracked.\nThen, check if part of the spring leaf or suspension is missing, shifted out of place or is in contact with another vehicle component (e.g., front mount, rear mount, shock absorber).\nThen say, if a spring leaf is broken (minor) + cracked or broken main spring leaf or more than one broken spring leaf in any spring assembly (major) + part of spring leaf or suspension is missing, shifted out of place or is in contact with another vehicle component (major)", "category": "EXT", "media": null}, {"id": "0023", "question": "Suspension fastener is loose, missing or broken", "answer": "Check bolts on spring leaf assembly, front mount, rear mount, and shock absorber.\nThen, check that the U-bolt is not loose\nThen say, if suspension fastener is loose, missing, or broken (minor) + loose u-bolt (major)", "category": "EXT", "media": null}, {"id": "0024", "question": "Damaged tread or sidewall of tire", "answer": "Check that tread is fine (inside/outside)\nThen check the tread tire depth (3mm front; 1.5mm rear)\nThen put your hand between back tires to check they are not touching\nThen check inside/outside of tire is not marked \"not for highway use\"\nThen check that the tire has no exposed cords in the tread or outer sidwall area\nThen verbalize minor/major", "category": "EXT", "media": null}, {"id": "0025", "question": "Tire leaking, if leak cannot be heard", "answer": "Check that you can't see a leak; kick tire\nThen, check that you can't feel/hear a leak\nThen, check that the tire is not flat\nThen verbalize minor/major", "category": "EXT", "media": null}, {"id": "0026", "question": "Hub oil below minimum level", "answer": "Check that oil is below min line in centre of tire\nThen, feel that the seal holding in oil is not leaking (no drips)\nThen, check for imminent wheel, hub, or bearing failure (no damage, crack); push/pull the tire\nThen say, if hub oil is below minimum level (minor) + leaking wheel seal (minor) + evidence of imminent wheel, hub or bearing failure (major)", "category": "EXT", "media": null}, {"id": "0027", "question": "Wheel has loose, missing, or ineffective fastener", "answer": "Check the bolts for the wheel\nThen, check for imminent wheel, hub, or bearing failure (no damage, crack); push/pull the tire\nThen say, wheel has loose, missing or ineffective fastener (major) + evidence of imminent wheel, hub or bearing failure (major)", "category": "EXT", "media": null}, {"id": "0028", "question": "Damaged, cracked, or broken wheel, rim or attaching part", "answer": "Check the wheel and rim for damage cracks on inside/outside\nThen, check for imminent wheel, hub, or bearing failure (no damage, crack); push/pull the tire\nThen say, if wheel or rim is damaged or cracked (major) + evidence of imminent wheel, hub or bearing failure (major)", "category": "EXT", "media": null}, {"id": "0029", "question": "Seat is damaged or fails to remain in set position", "answer": "Check that the seat is normal and it locks in place\nThen, check that the seat belt and tether belt is secure, present and working\nThen say, if seat is damaged or fails to remain in set position (minor) + seatbelt or tether belt is insecure, missing or malfunctions (major)", "category": "INT", "media": null}, {"id": "0030", "question": "Emergency equipment is missing, damaged or defective", "answer": "Check that the emergency kit, fire extinguisher, and triangles are there\nThen verbalize minor", "category": "INT", "media": null}, {"id": "0031", "question": "Required mirror or window glass fails to provide the required view to the driver as a result of being cracked, broken, damaged, missing or maladjusted", "answer": "Check mirrors and all glass (full 360 of cab) that nothing is cracked, broken, damaged, missing, maladjusted\nThe verbalize minor", "category": "INT", "media": null}, {"id": "0032", "question": "Heater/defroster > control or system failure", "answer": "Turn on heater all the way and put hand near vent then turn fan up one step at a time and say you feel it.\nThen say, if the control or system fails (minor) + defroster fails to provide unobstructed view through the windshield due to rain/snow/ice (major)", "category": "INT", "media": null}, {"id": "0033", "question": "Wiper/washer > control or system malfunction\nwiper blade is damaged, missing or fails\nadequately clear driver's field of vision", "answer": "Turn on wiper low/high then use the washer fluid (push)\nThen say, if the control or system malfunctioned, blades damaged/missing or fails or do not adequately clear field of vision (minor) + major if rain/snow/ice", "category": "INT", "media": null}];

const $ = (id) => document.getElementById(id);

const screens = {
  setup:  $('screen-setup'),
  review: $('screen-review'),
  score:  $('screen-score'),
};
function show(name) {
  for (const k of Object.keys(screens)) screens[k].classList.toggle('active', k === name);
}

const state = {
  selected: new Set(),
  cards: [],
  index: 0,
  results: [],
};

function categoryCounts(data) {
  const counts = {};
  for (const c of data) counts[c.category] = (counts[c.category] || 0) + 1;
  return counts;
}

function renderChips() {
  const counts = categoryCounts(FLASHCARDS_DATA);
  const chipsEl = $('chips');
  chipsEl.innerHTML = '';
  for (const cat of Object.keys(counts).sort()) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (state.selected.has(cat) ? ' on' : '');
    btn.innerHTML = `${cat}<span class="count">${counts[cat]}</span>`;
    btn.addEventListener('click', () => {
      if (state.selected.has(cat)) state.selected.delete(cat);
      else state.selected.add(cat);
      renderChips();
      syncCountDefault();
    });
    chipsEl.appendChild(btn);
  }
}

function availableInSelection() {
  return FLASHCARDS_DATA.filter((c) => state.selected.has(c.category)).length;
}

function syncCountDefault() {
  const input = $('count-input');
  const avail = availableInSelection();
  input.max = String(avail);
  if (!input.dataset.userTouched) input.value = String(avail);
  $('start-btn').disabled = avail === 0 || Number(input.value) <= 0;
}

function startReview() {
  const requested = Math.max(1, Math.min(availableInSelection(), Number($('count-input').value) || 0));
  const selectedCats = [...state.selected];
  const sampled = stratifiedSample(FLASHCARDS_DATA, requested, selectedCats);
  state.cards = shuffle(sampled, Math.random);
  state.index = 0;
  state.results = [];
  show('review');
  renderCard();
}

function clearMediaSlot(side) {
  const slot = $(`media-${side}`);
  const img = $(`media-${side}-img`);
  const audio = $(`media-${side}-audio`);
  slot.hidden = true;
  img.hidden = true;
  img.removeAttribute('src');
  audio.pause();
  audio.hidden = true;
  audio.removeAttribute('src');
}

function fillMediaSlot(media) {
  const slot = $(`media-${media.side}`);
  const el = $(`media-${media.side}-${media.kind === 'image' ? 'img' : 'audio'}`);
  el.src = media.src;
  el.hidden = false;
  slot.hidden = false;
}

function renderCard() {
  const card = state.cards[state.index];
  $('progress').textContent = `Card ${state.index + 1} of ${state.cards.length}`;
  $('question').textContent = card.question;
  $('answer-text').textContent = card.answer;
  $('answer-category').textContent = card.category;
  $('answer-block').hidden = true;
  $('rate-row').hidden = true;
  $('reveal-row').hidden = false;

  clearMediaSlot('question');
  clearMediaSlot('answer');
  if (card.media) fillMediaSlot(card.media);
}

function reveal() {
  $('answer-block').hidden = false;
  $('reveal-row').hidden = true;
  $('rate-row').hidden = false;
}

function rate(correct) {
  const card = state.cards[state.index];
  state.results.push({ category: card.category, correct });
  state.index += 1;
  if (state.index >= state.cards.length) finish();
  else renderCard();
}

function finish() {
  const summary = scoreSummary(state.results);
  $('score-total').textContent = `${summary.total.correct} / ${summary.total.total} correct`;
  const bd = $('score-breakdown');
  bd.innerHTML = '';
  for (const cat of Object.keys(summary.byCategory).sort()) {
    const slot = summary.byCategory[cat];
    const row = document.createElement('div');
    row.className = 'score-row';
    row.innerHTML = `<span>${cat}</span><span class="pct">${slot.correct} / ${slot.total}</span>`;
    bd.appendChild(row);
  }
  show('score');
}

function restart() {
  $('count-input').dataset.userTouched = '';
  state.selected = new Set(Object.keys(categoryCounts(FLASHCARDS_DATA)));
  renderChips();
  syncCountDefault();
  show('setup');
}

$('count-input').addEventListener('input', () => {
  $('count-input').dataset.userTouched = '1';
  $('start-btn').disabled = availableInSelection() === 0 || Number($('count-input').value) <= 0;
});
$('start-btn').addEventListener('click', startReview);
$('reveal-btn').addEventListener('click', reveal);
$('good-btn').addEventListener('click', () => rate(true));
$('bad-btn').addEventListener('click', () => rate(false));
$('restart-btn').addEventListener('click', restart);

state.selected = new Set(Object.keys(categoryCounts(FLASHCARDS_DATA)));
renderChips();
syncCountDefault();
</script>

<script type="module">
// Stratified sample with largest-remainder rounding.
// Filters `cards` to categories in `selectedCategories`, then picks counts
// per category proportional to availability. Caps at per-category supply
// and at total availability. Tie-breaks on equal remainders by the order
// each category appears in `selectedCategories`.
export function stratifiedSample(cards, n, selectedCategories) {
  if (n === 0 || selectedCategories.length === 0) return [];

  const selected = new Set(selectedCategories);
  const filtered = cards.filter((c) => selected.has(c.category));
  if (filtered.length === 0) return [];

  const byCat = new Map();
  for (const cat of selectedCategories) byCat.set(cat, []);
  for (const c of filtered) byCat.get(c.category).push(c);

  const total = filtered.length;
  const effectiveN = Math.min(n, total);

  const entries = [];
  for (const [cat, list] of byCat) {
    if (list.length === 0) continue;
    const raw = (list.length / total) * effectiveN;
    const quota = Math.floor(raw);
    entries.push({ cat, list, quota, remainder: raw - quota });
  }

  let leftover =
    effectiveN - entries.reduce((sum, e) => sum + e.quota, 0);

  const order = entries
    .map((_, i) => i)
    .sort(
      (a, b) =>
        entries[b].remainder - entries[a].remainder || a - b,
    );

  for (const i of order) {
    if (leftover <= 0) break;
    if (entries[i].quota < entries[i].list.length) {
      entries[i].quota += 1;
      leftover -= 1;
    }
  }

  const out = [];
  for (const e of entries) {
    out.push(...e.list.slice(0, e.quota));
  }
  return out;
}

// Tallies a list of {category, correct} results into total + per-category counts.
export function scoreSummary(results) {
  const byCategory = {};
  let totalCorrect = 0;
  for (const r of results) {
    const slot = byCategory[r.category] || { correct: 0, total: 0 };
    slot.total += 1;
    if (r.correct) {
      slot.correct += 1;
      totalCorrect += 1;
    }
    byCategory[r.category] = slot;
  }
  return {
    total: { correct: totalCorrect, total: results.length },
    byCategory,
  };
}

// Fisher-Yates shuffle. Returns a new array; does not mutate input.
// `rng` must be a function returning a number in [0, 1).
export function shuffle(arr, rng) {
  const out = [...arr];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}


const FLASHCARDS_DATA = [{"id": "q_0001_1", "question": "Why can GPS units alone not replace basic land navigation skills for Search and Rescue personnel?", "answer": "Even with GPS aids, the basics of land navigation cannot be overlooked because search and rescue operations require each member to know their exact location at all times, and land navigation is an individual skill that must be continually practised to maintain proficiency.", "category": "Compass & Land Navigation"}, {"id": "q_0001_2", "question": "What are three purposes that maps serve according to the excerpt?", "answer": "Maps enable users to get from one location to another, allow users to recognise features on the ground that are portrayed on the map, and help users picture terrain and its possibilities even without having seen it in person.", "category": "Map Reading & Cartography"}, {"id": "q_0001_3", "question": "How is a map formally defined in this excerpt?", "answer": "A map is defined as a representation on a flat surface of the whole or part of the earth's surface.", "category": "Map Reading & Cartography"}, {"id": "q_0002_1", "question": "What colour is used on topographical maps to indicate areas that have not been confirmed and are new to the map?", "answer": "Purple is used to denote areas that are new to the map and have not been confirmed.", "category": "Map Reading & Cartography"}, {"id": "q_0002_2", "question": "How are modern topographic maps constructed?", "answer": "Modern maps are constructed through aerial photography combined with information from field surveys, using standard symbols and consistent scale.", "category": "Map Reading & Cartography"}, {"id": "q_0002_3", "question": "How can map scale be expressed?", "answer": "Scale can be expressed as a fraction (e.g., 1/50 000) or as a ratio (e.g., 1:50 000), both representing the relationship between a distance on the map and the corresponding distance on the ground.", "category": "Map Reading & Cartography"}, {"id": "q_0003_1", "question": "What is the correct procedure for measuring a straight-line distance between two points on a map using a strip of paper?", "answer": "Lay the edge of the paper strip against the two points and mark tick marks at each. Then align the paper along the map's scale with the right-hand mark at a main division and the left-hand mark in the subdivisions left of zero; the distance equals the major divisions plus the distance left of zero.", "category": "Map Reading & Cartography"}, {"id": "q_0003_2", "question": "What does a contour line represent on a topographical map?", "answer": "A contour shows relief — the general shape and height of the ground above or below a set index, which is normally sea level.", "category": "Map Reading & Cartography"}, {"id": "q_0003_3", "question": "On a map scale, what is the relationship between scale size and the level of detail shown?", "answer": "A larger scale shows a larger area but with less detail, while a smaller scale shows less area but with greater and more accurate detail.", "category": "Map Reading & Cartography"}, {"id": "q_0004_1", "question": "What does a contour interval represent on a topographic map, and where is it recorded?", "answer": "A contour interval represents the vertical distance (slope) between contour lines. It varies from map to map and is always recorded in the map margin.", "category": "Map Reading & Cartography"}, {"id": "q_0004_2", "question": "When giving a grid reference, which value is stated first — the easting or the northing?", "answer": "The easting value is always given first, followed by the northing. A memory aid is that E comes before N alphabetically.", "category": "Map Tools & Coordinates"}, {"id": "q_0004_3", "question": "How accurate is an eight-digit grid reference, and how does it differ from a standard grid reference?", "answer": "An eight-digit grid reference places the user within 10 metres of the desired target, providing greater accuracy than a standard (six-digit) grid reference.", "category": "Map Reading & Cartography"}, {"id": "q_0005_1", "question": "What is a roamer and what is its primary purpose in map reading?", "answer": "A roamer is an instrument graduated in tenths, on the same scale as the map being used, to determine the location of a point within a Grid Square by providing an accurate reference for any point placed within it.", "category": "Map Tools & Coordinates"}, {"id": "q_0005_2", "question": "What reference point does longitude use as its 0-degree starting line, and what is it also known as?", "answer": "Longitude uses the prime meridian as its 0-degree starting line, which is also known as the Greenwich Meridian.", "category": "Map Tools & Coordinates"}, {"id": "q_0005_3", "question": "In what direction do lines of latitude run, and what is the range of latitude values?", "answer": "Lines of latitude run in an east-west direction, ranging from 0 degrees at the equator to 90 degrees north or south at the respective poles.", "category": "Map Tools & Coordinates"}, {"id": "q_0006_1", "question": "How many seconds are in one degree of latitude or longitude?", "answer": "One degree is divided into 60 minutes and each minute into 60 seconds, giving 3,600 seconds in one degree.", "category": "Map Tools & Coordinates"}, {"id": "q_0006_2", "question": "What is the recommended method for folding a map to prevent tears?", "answer": "Fold it in half lengthways with the map facing outwards, then fold across concertina fashion, reducing it to a convenient size so any part can be read by opening the appropriate folds without fully unfolding it.", "category": "Map Reading & Cartography"}, {"id": "q_0006_3", "question": "When constructing a Romer, what does each mark on the paper's edge represent?", "answer": "Each mark represents 100 metres on a grid square.", "category": "Map Tools & Coordinates"}, {"id": "q_0007_1", "question": "What is a bearing in land navigation?", "answer": "A bearing is an angle measured clockwise that a line makes with a fixed zero line, which is always north. It provides an accurate indication of the direction of one point in relation to another.", "category": "Compass & Land Navigation"}, {"id": "q_0007_3", "question": "Into how many degrees is a circle divided, and how can each degree be further subdivided?", "answer": "A circle is divided into 360 degrees. Each degree can be divided into 60 minutes, and each minute can be further subdivided into seconds.", "category": "Compass & Land Navigation"}, {"id": "q_0008_1", "question": "What is the cause of the variation between true north and magnetic north?", "answer": "Magnetic north is a large ore body located in the Arctic Circle that shifts location every year, making it non-stationary.", "category": "Compass & Land Navigation"}, {"id": "q_0008_2", "question": "Why is the comfort of a SAR member's backpack considered important during a search operation?", "answer": "An uncomfortable pack distracts the SAR member from the task of searching, while a comfortable, well-packed backpack allows them to focus on seeking clues.", "category": "SAR Equipment & Clothing"}, {"id": "q_0008_3", "question": "What is the term for the angle between grid north and magnetic north?", "answer": "The grid magnetic angle (also called declination).", "category": "Compass & Land Navigation"}, {"id": "q_0009_1", "question": "What material should be worn next to the skin during a SAR operation, and why?", "answer": "Moisture wicking material should be worn next to the skin to wick away perspiration produced during SAR tasks, improving comfort.", "category": "SAR Equipment & Clothing"}, {"id": "q_0009_2", "question": "What two properties must SAR footwear have to protect the member during operations?", "answer": "SAR footwear must provide proper ankle support even after being broken in, and the exterior must be made of water-resistant material.", "category": "SAR Equipment & Clothing"}, {"id": "q_0009_3", "question": "Why is proper boot fit critical for SAR members?", "answer": "A boot that is too big or too small will eventually create foot problems such as blisters, which reduce a SAR member's effectiveness on a search.", "category": "SAR Equipment & Clothing"}, {"id": "q_0010_1", "question": "Why should SAR members begin hydrating before the day of a search operation rather than only on the day itself?", "answer": "Starting to drink liquids only on the day of the search will not provide the SAR member with a proper level of hydration; regular hydration must be an established practice beforehand.", "category": "SAR Nutrition & Hydration"}, {"id": "q_0010_2", "question": "What dual purpose does carrying high-energy food serve for a SAR member during a search operation?", "answer": "It provides the searcher with nutrients to sustain themselves during the search and can also be used as food supply in a survival situation.", "category": "SAR Nutrition & Hydration"}, {"id": "q_0010_3", "question": "What are three features to look for when selecting a backpack for SAR operations?", "answer": "Sturdy padded straps, water-resistant material, and outside compartments for easy access to frequently used items.", "category": "SAR Equipment & Clothing"}, {"id": "q_0011_1", "question": "What is identified as the first psychological reaction that occurs in a survival situation?", "answer": "Fear is the first psychological reaction. It is described as a normal reaction that varies in degree from person to person and can be controlled, though it cannot be avoided or denied.", "category": "Survival Psychology"}, {"id": "q_0011_2", "question": "What dual purpose does a coffee tin serve in a basic survival kit?", "answer": "A coffee tin serves as a container to hold the survival items and can also be used as a cooking pot.", "category": "Survival Skills & Priorities"}, {"id": "q_0011_3", "question": "Why are E.R.T. members increasingly required to be prepared for unexpected stays in remote bush areas?", "answer": "E.R.T. members are being flown into remote areas for operational calls more frequently, particularly in the Northeast and Northwest, and may need to stay unexpectedly due to a helicopter being grounded for bad weather or experiencing mechanical difficulties.", "category": "Search Operations Management"}, {"id": "q_0012_1", "question": "What two factors are identified as increasing fear in a survival situation?", "answer": "Helplessness and hopelessness are the two factors that increase fear in a survival situation.", "category": "Survival Psychology"}, {"id": "q_0012_2", "question": "What is the primary threat posed by cold in a survival situation?", "answer": "Cold lowers a person's ability to think rationally, making it a greater threat than most people plan for; having proper clothing best defeats it.", "category": "Survival Skills & Priorities"}, {"id": "q_0012_3", "question": "After how many days without fluids does the body start to quickly deteriorate, and what are the early warning signs of dehydration?", "answer": "After only 3 days without any fluid the body can quickly deteriorate. Early warning signs include dry lips, parched throat, and dark coloured urine.", "category": "Survival Skills & Priorities"}, {"id": "q_0013_1", "question": "How long can the human body survive on stored body fat and water according to survival training guidance?", "answer": "The body can live 30 days or more on stored body fat and water, so in a survival situation you should not eat on the first day and instead draw energy from the previous day's meals.", "category": "Survival Skills & Priorities"}, {"id": "q_0013_2", "question": "What are the five steps of the Survival Pattern listed in the excerpt?", "answer": "The five steps are: First Aid, Fire, Shelters, Signals, and Water.", "category": "Survival Skills & Priorities"}, {"id": "q_0013_3", "question": "What psychological effects can result from loneliness in a survival situation?", "answer": "Loneliness can cause a person to start hearing things that may or may not actually be there, compounded by being alone in unfamiliar surroundings.", "category": "Survival Psychology"}, {"id": "q_0014_1", "question": "Why should you ration food rather than spend time hunting in a survival situation?", "answer": "There is a greater chance of coming up empty handed than actually catching something, so hunting wastes valuable time.", "category": "Survival Skills & Priorities"}, {"id": "q_0014_2", "question": "In a group survival situation, why is it important to maintain group morale?", "answer": "Once one person starts to feel down, it does not take long for others to start feeling the same way.", "category": "Survival Psychology"}, {"id": "q_0014_3", "question": "What is the risk of forming an opinion too early during a SAR mission based on a few clues?", "answer": "It can influence the tactics used during the operation rather than allowing each clue to be evaluated objectively.", "category": "Clue Management"}, {"id": "q_0015_1", "question": "Into what four categories are search-and-rescue clues divided?", "answer": "Clues are divided into Physical (items or events), Documentary (written records), Testimonial (statements by others), and Analytical (deductive reasoning).", "category": "Clue Management"}, {"id": "q_0015_2", "question": "Why is time a critical factor when dealing with clues during a search operation?", "answer": "Clues can disappear quickly due to environmental conditions like rain or snow, so searchers must track when the subject became lost, when clues were made, and how long they are likely to remain available.", "category": "Clue Management"}, {"id": "q_0015_3", "question": "Why should searchers focus on clues rather than searching only for the lost person directly?", "answer": "A single lost person can leave behind hundreds of clues (e.g., 1,800 footprints), which have a better collective chance of leading to the person than ignoring those clues and searching for the person alone.", "category": "Clue Management"}, {"id": "q_0016_1", "question": "What is the purpose of the Sign Cutting technique in search operations?", "answer": "Sign Cutting saves time and increases efficiency by having multiple clue-aware teams make sweeps to cut the same track sign while one team follows the trail step by step, allowing teams to leapfrog ahead and quickly reduce the area that needs to be searched.", "category": "Search Techniques"}, {"id": "q_0016_2", "question": "What is the first action a searcher must take upon locating possible evidence or a crime scene?", "answer": "The first action is to stop the searching technique and notify the team leader, who then notifies the Command Post.", "category": "Evidence & Legal Procedures"}, {"id": "q_0016_3", "question": "Why is hypothermia considered dangerous even outside of winter conditions?", "answer": "Hypothermia is dangerous in any season because more people die from it during spring and fall than in winter, and the condition can deteriorate rapidly without the person realizing it if the initial warning sign of shivering is ignored.", "category": "Hypothermia & Cold Injuries"}, {"id": "q_0017_1", "question": "What are the five major heat loss areas of the body that must be addressed in hypothermia prevention and treatment?", "answer": "The five major heat loss areas are the head (accounting for approximately 50% of heat loss), the torso, the groin, the armpits, and the neck.", "category": "Hypothermia & Cold Injuries"}, {"id": "q_0017_2", "question": "What is 'afterdrop' in the context of hypothermia, and how is it avoided?", "answer": "Afterdrop is the further lowering of the body core temperature caused when external heat applied to the extremities draws blood away from the core. It is avoided by limiting external warming to the torso only.", "category": "Hypothermia & Cold Injuries"}, {"id": "q_0017_3", "question": "At what core body temperature does shivering stop during the stages of hypothermia?", "answer": "Shivering stops when the core body temperature drops to between 33°C and 30°C (Stage 2), as surface blood supply also shuts down and confusion and lethargy set in.", "category": "Hypothermia & Cold Injuries"}, {"id": "q_0018_1", "question": "What are the recommended treatment steps for frostbite?", "answer": "Prevent further heat loss and rewarm the affected area using body heat — such as firm pressure from a warm hand, breathing on the area, or placing it against your body. Do not apply direct heat and do not rub the frostbitten area.", "category": "First Aid"}, {"id": "q_0018_2", "question": "What symptom distinguishes heat-stroke from many other heat-related conditions?", "answer": "Heat-stroke presents with hot, dry skin along with a fast and strong pulse, rising temperature, and severe headaches often accompanied by vomiting.", "category": "First Aid"}, {"id": "q_0018_3", "question": "Why is using an organized search pattern important when multiple personnel are assisting in a search operation?", "answer": "An organized search pattern ensures resources are used efficiently and allows searchers to track where others are and what areas have already been covered, preventing chaos.", "category": "Search Operations Management"}, {"id": "q_0019_1", "question": "In today's OPP SAR environment, what is the primary use of the grid search technique?", "answer": "The grid search is primarily used for evidence searches or searching for a lost person who is believed to be unresponsive.", "category": "Search Techniques"}, {"id": "q_0019_2", "question": "According to the resource data, approximately how many searchers are required to grid search one square mile at a 50% probability of detection?", "answer": "At 50% probability of detection with 100-foot spacing, approximately 53 searchers are required, taking 3.5 hours each for a total of 185.5 searcher hours.", "category": "Search Operations Management"}, {"id": "q_0019_3", "question": "What was the original rationale behind the grid search technique used by the OPP until the late 1980s?", "answer": "The logic was that the more searchers standing shoulder to shoulder walking in a straight line, the higher the probability of detection would be.", "category": "Search Operations Management"}, {"id": "q_0020_1", "question": "In a grid search where the number of searchers is smaller than the search area, who is responsible for maintaining the compass bearing and recording tallies covered?", "answer": "The centre person in the grid search is responsible for the compass bearing and the recording of tallies covered.", "category": "Search Formations & Roles"}, {"id": "q_0020_2", "question": "What is the main caution associated with using the Staggered Line formation during a search?", "answer": "If one team makes an error, the others will follow suit, so mistakes can propagate through the entire formation.", "category": "Search Formations & Roles"}, {"id": "q_0020_3", "question": "In the Grouping search configuration, what is the effective spacing equivalent produced by this formation?", "answer": "The Grouping formation produces results equivalent to one person every 20 feet, despite pairing observers together.", "category": "Search Formations & Roles"}, {"id": "q_0021_1", "question": "What is the role of the centre person in a Hasty Team search formation?", "answer": "The centre person is responsible for maintaining the compass bearing and overall direction of the team, and for keeping in contact with the other two team members.", "category": "Search Techniques"}, {"id": "q_0021_2", "question": "What type of subjects is the Hasty Team technique best suited for searching?", "answer": "The Hasty Team technique is best utilized when searching for a responsive subject.", "category": "Search Techniques"}, {"id": "q_0021_3", "question": "Why is making sweeps at right angles to each other recommended in a multiple-pass search?", "answer": "Making sweeps at right angles increases the overall probability of detection because the area is covered from two different directions, compensating for the lower individual detection probability of each single pass.", "category": "Search Techniques"}, {"id": "q_0022_2", "question": "What is the key caution when using the natural contour search method?", "answer": "The natural feature being followed must be clearly distinguishable to the search team, since this method relies on topographical features rather than a compass operator.", "category": "Search Techniques"}, {"id": "q_0022_3", "question": "How does the Track Crawl method work in a search?", "answer": "A small team of 3-5 members follows a trail or the lost subject's indicated direction of travel, with some members on the path and others searching either side for clues.", "category": "Search Techniques"}, {"id": "q_0023_1", "question": "Why does the binary signcut technique require redundancy despite being the most efficient use of limited resources?", "answer": "Because it is performed by humans, it cannot be perfect, so redundancy is essential to compensate for human error.", "category": "Search Techniques"}, {"id": "q_0023_3", "question": "What is the primary advantage of establishing a confined search area with specific boundaries?", "answer": "A smaller, bounded search area requires fewer searchers, less time to cover effectively, and improves the chances of rapid subject recovery.", "category": "Search Operations Management"}, {"id": "q_0024_1", "question": "Why do listening posts work especially well at night during a search and rescue operation?", "answer": "Sound travels much farther at night and is easier to hear, making it more likely that personnel will detect sounds from a lost person or that their own sounds will elicit a response.", "category": "Search Techniques"}, {"id": "q_0024_2", "question": "What is the purpose of track traps in a search and rescue operation?", "answer": "Track traps involve brushing off or dragging bare roads and lightly travelled back areas to detect signs that a lost person has passed through, indicating their direction of travel.", "category": "Search Techniques"}, {"id": "q_0024_3", "question": "Why must roadblocks be established during a search and rescue operation?", "answer": "A lost person may unknowingly walk out of the search area on a road and catch a ride with a vehicle, leaving without knowing a search was underway, so roadblocks and patrols prevent undetected exits.", "category": "Search Operations Management"}, {"id": "q_0025_1", "question": "What is the relationship between critical distance and searcher spacing in a search line?", "answer": "If the critical distance is determined to be 15 feet, searchers are spread out at 30-foot intervals, because each searcher is responsible for 15 feet to their left and right.", "category": "Search Operations Management"}, {"id": "q_0025_2", "question": "What are the two recommended uses for the second team member when deploying a Hip Chain?", "answer": "The second member walks behind to report any breakage in the string line, and can also tie flagging tape to the string to increase its visibility.", "category": "Search Techniques"}, {"id": "q_0025_3", "question": "Which factors determine the critical distance a searcher can effectively cover?", "answer": "Critical distance is influenced by the size of the object being searched for, terrain, ground cover, weather conditions, and the fatigue level of the searchers.", "category": "Search Operations Management"}, {"id": "q_0026_1", "question": "How does the chapter define 'urban' for the purpose of urban search and rescue?", "answer": "The term 'urban' is used to describe an area somewhere in the middle of the spectrum between 'pure urban' (like Manhattan) and 'pure wilderness' (like the Yukon), and may include a mixture of woods, suburban, and pure urban environments.", "category": "Urban Search & Rescue"}, {"id": "q_0026_2", "question": "Why is it important for every SAR member to be knowledgeable about all search patterns?", "answer": "Because any SAR member may be responsible for leading a search team comprised of both police and civilian volunteers during an operational search.", "category": "Search Operations Management"}, {"id": "q_0026_3", "question": "What example does the text give of wilderness existing within an urban area?", "answer": "The best white water rapids in Virginia exist in the middle of downtown Richmond, where rescuers may face heavily wooded areas with vertical rock faces in an otherwise urban environment.", "category": "Urban Search & Rescue"}, {"id": "q_0027_1", "question": "Why is the term 'Urban Search and Rescue' considered to be misapplied when used in the context of disaster response?", "answer": "The term has been erroneously applied to Disaster Search and Rescue, where building collapse is the main focus; it properly refers to finding a single lost or missing individual in an urbanized area.", "category": "Urban Search & Rescue"}, {"id": "q_0027_2", "question": "Why do wilderness SAR resources struggle when operating in urban environments?", "answer": "Challenges such as working dogs in heavy traffic, searching trash dumpsters in summer, and requiring police escorts in parts of town have led to less effective efforts.", "category": "Urban Search & Rescue"}, {"id": "q_0027_3", "question": "Why might an elderly person with Alzheimer's go unnoticed even after wandering for miles in an urban area?", "answer": "People in urban environments actively tune out their surroundings, so unusual behavior like walking in only socks does not draw attention or raise concern.", "category": "Urban Search & Rescue"}, {"id": "q_0028_1", "question": "Why do topographic maps present a particular challenge for search teams operating in urban environments?", "answer": "Urban areas grow rapidly, so topographic maps are almost certainly out of date and may not reflect wooded areas, streams, or ravines that actually exist. Search teams often rely on commercial city road maps instead.", "category": "Urban Search & Rescue"}, {"id": "q_0028_2", "question": "What makes clue management especially difficult during an urban search-and-rescue operation?", "answer": "Urban environments are 'clue rich,' but the vast majority of clues found (99.99%) are unrelated ambient trash. Simultaneous media-generated sightings in multiple parts of the city also overwhelm investigators.", "category": "Clue Management"}, {"id": "q_0028_3", "question": "How do buildings complicate a search for a missing person in an urban area?", "answer": "Buildings add a three-dimensional aspect to the search: a missing child could be in any crevice on any floor of a structure such as an abandoned warehouse, and a single building may require several teams working all day to search adequately.", "category": "Urban Search & Rescue"}, {"id": "q_0029_1", "question": "What is described as a relatively rare occurrence for wilderness searchers placed in an urban search environment?", "answer": "Drug-related encounters are described as relatively rare, despite being a prevalent worry, when compared to other possibilities in the urban search environment.", "category": "Urban Search & Rescue"}, {"id": "q_0029_2", "question": "Why must dog handlers exercise particularly close control of their dogs in urban search environments?", "answer": "High-speed traffic, food scraps, and possibly hazardous chemicals require handlers to keep close control, potentially working the dog on a long lead instead of off lead.", "category": "Urban Search & Rescue"}, {"id": "q_0029_3", "question": "How do the hazards of urban search compare to those of wilderness search according to the excerpt?", "answer": "The hazards are different but not necessarily greater; wilderness search involves terrain, weather, and wildlife, while urban search involves traffic, smog, and persons of varying degrees of threat.", "category": "Urban Search & Rescue"}, {"id": "q_0030_1", "question": "Why must distant sightings of a missing subject be taken more seriously in urban searches than in rural searches?", "answer": "Because rapid transit availability in cities means the subject could realistically travel several miles or even cross state lines, making long-distance sightings plausible.", "category": "Urban Search & Rescue"}, {"id": "q_0030_2", "question": "What are two examples given of people becoming trapped or incapacitated in man-made urban hazards?", "answer": "Children trapped in trunks of old cars or refrigerators, and hit-and-run victims lying injured in roadside culverts.", "category": "Urban Search & Rescue"}, {"id": "q_0030_3", "question": "What is noted as a surprising finding about where missing urban subjects are often located?", "answer": "A fair number of subjects were lying in plain sight of passersby or homeowners and were never noticed.", "category": "Urban Search & Rescue"}, {"id": "q_0031_1", "question": "Why is detailed documentation considered essential during a search operation?", "answer": "Without documentation, it becomes impossible to ensure that an area has been adequately searched or to identify gaps in coverage.", "category": "Search Operations Management"}, {"id": "q_0031_2", "question": "What is the minimum number of people required to completely contain a building, and where must they be positioned?", "answer": "A minimum of four people — two at opposite diagonal corners on the ground and two more at the adjacent corners on the roof — can completely contain a building.", "category": "Building Search"}, {"id": "q_0031_3", "question": "How can containment be achieved in an urban environment without police road patrols?", "answer": "Stakeouts (park-ins) at intersections can serve as adequate containment, though a determined evasive subject could still slip through with conscious effort.", "category": "Urban Search & Rescue"}, {"id": "q_0032_1", "question": "Why is a high POD (Probability of Detection) search considered mandatory when searching for a missing child in an urban environment?", "answer": "Because if the subject could have called for help they likely would have by now, meaning the subject is probably unresponsive. Rapid sweep tasks will not locate an unconscious child in a small, concealed space, so every location must be thoroughly searched.", "category": "Urban Search & Rescue"}, {"id": "q_0032_2", "question": "Why do complex urban areas require smaller search tasks compared to wooded areas?", "answer": "Because urban areas contain more obstacles and structures — for example, a subdivision of 100 one-acre lots can take all day to search, whereas a woodland sweep of 100 acres might take only 4–6 hours. Greater complexity demands smaller, more focused task areas to search effectively.", "category": "Search Operations Management"}, {"id": "q_0032_3", "question": "Why should search sector boundaries be drawn along easements rather than down the middle of streets?", "answer": "Dividing sectors along the middle of streets can create search areas crisscrossed by numerous fences, making them harder to search efficiently. Using easements as boundaries avoids this problem.", "category": "Search Operations Management"}, {"id": "q_0033_1", "question": "What should a searcher do if a property owner denies them access to their property during an urban search?", "answer": "The searcher should leave the property immediately and let the police handle it, and report the area they could not search to their Field Team Leader.", "category": "Urban Search & Rescue"}, {"id": "q_0033_2", "question": "Why is carrying a large flashlight recommended during nighttime urban searches?", "answer": "A large flashlight helps the searcher appear less suspicious to residents and is also useful for checking dark areas like culvert pipes, even in daylight.", "category": "Search Techniques"}, {"id": "q_0033_3", "question": "What is the recommended composition of a multi-block task force in urban search operations?", "answer": "A Task Force Leader, one dog team, one to two interviewers, and numerous searchers — a mix that can produce a very high probability of detection in a short time.", "category": "SAR Team Leadership"}, {"id": "q_0034_1", "question": "What are the two primary concerns of a field team leader during a search operation?", "answer": "Quality control and safety are the field team leader's utmost concerns.", "category": "Search Operations Management"}, {"id": "q_0034_2", "question": "Why must a field team leader float between groups when a team is split to cover both sides of a street?", "answer": "The leader must remain available to the entire team to maintain adequate quality control and fulfill the role of recording, directing, and leading.", "category": "SAR Team Leadership"}, {"id": "q_0034_3", "question": "What legal authorization is required for searchers to enter private property during an urban search?", "answer": "Permission must be obtained by the police through either the landowner's consent or a court-authorized search warrant.", "category": "Evidence & Legal Procedures"}, {"id": "q_0035_1", "question": "What tactic is used to confirm that a missing subject has not left a building before conducting a multi-story search?", "answer": "Sign cutting with scent-discriminating tracking/trailing dogs is used to determine whether the subject has left the building.", "category": "Building Search"}, {"id": "q_0035_3", "question": "What role should a building superintendent play during a multi-story search?", "answer": "A building superintendent with a master key should accompany the search team so that every locked area can be opened, checked, and then relocked.", "category": "Search Operations Management"}, {"id": "q_0036_1", "question": "What marking methods can be used to track which rooms have been cleared during a building search when a floor plan is unavailable?", "answer": "Nonpermanent marking devices such as flagging tape on door knobs or chalk marks can be used to indicate cleared rooms.", "category": "Search Techniques"}, {"id": "q_0036_2", "question": "What is the 'Drive-and-Sniff' search task and what does it require from the dog team?", "answer": "It is a free-form search where a dog team drives a large area and stops to investigate small patches of woods, empty lots, culverts, and similar spots. It requires very careful mapping by the team and an exacting debrief back at base.", "category": "Search Techniques"}, {"id": "q_0036_3", "question": "What must happen to containment lines as teams search a single-story building from one end to the other?", "answer": "Containment must be moved forward to hall intersections as teams advance, so the subject cannot slip back through the line.", "category": "Building Search"}, {"id": "q_0037_1", "question": "How does urban searching compare to wilderness searching according to the excerpt?", "answer": "They are ultimately the same — both are efforts to find someone who is missing or injured — though the city is a much more difficult place to search due to its complexities.", "category": "Urban Search & Rescue"}];

const $ = (id) => document.getElementById(id);

const screens = {
  setup:  $('screen-setup'),
  review: $('screen-review'),
  score:  $('screen-score'),
};
function show(name) {
  for (const k of Object.keys(screens)) screens[k].classList.toggle('active', k === name);
}

const state = {
  selected: new Set(),
  cards: [],
  index: 0,
  results: [],
};

function categoryCounts(data) {
  const counts = {};
  for (const c of data) counts[c.category] = (counts[c.category] || 0) + 1;
  return counts;
}

function renderChips() {
  const counts = categoryCounts(FLASHCARDS_DATA);
  const chipsEl = $('chips');
  chipsEl.innerHTML = '';
  for (const cat of Object.keys(counts).sort()) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (state.selected.has(cat) ? ' on' : '');
    btn.innerHTML = `${cat}<span class="count">${counts[cat]}</span>`;
    btn.addEventListener('click', () => {
      if (state.selected.has(cat)) state.selected.delete(cat);
      else state.selected.add(cat);
      renderChips();
      syncCountDefault();
    });
    chipsEl.appendChild(btn);
  }
}

function availableInSelection() {
  return FLASHCARDS_DATA.filter((c) => state.selected.has(c.category)).length;
}

function syncCountDefault() {
  const input = $('count-input');
  const avail = availableInSelection();
  input.max = String(avail);
  if (!input.dataset.userTouched) input.value = String(avail);
  $('start-btn').disabled = avail === 0 || Number(input.value) <= 0;
}

function startReview() {
  const requested = Math.max(1, Math.min(availableInSelection(), Number($('count-input').value) || 0));
  const selectedCats = [...state.selected];
  const sampled = stratifiedSample(FLASHCARDS_DATA, requested, selectedCats);
  state.cards = shuffle(sampled, Math.random);
  state.index = 0;
  state.results = [];
  show('review');
  renderCard();
}

function renderCard() {
  const card = state.cards[state.index];
  $('progress').textContent = `Card ${state.index + 1} of ${state.cards.length}`;
  $('question').textContent = card.question;
  $('answer-text').textContent = card.answer;
  $('answer-category').textContent = card.category;
  $('answer-block').hidden = true;
  $('rate-row').hidden = true;
  $('reveal-row').hidden = false;
}

function reveal() {
  $('answer-block').hidden = false;
  $('reveal-row').hidden = true;
  $('rate-row').hidden = false;
}

function rate(correct) {
  const card = state.cards[state.index];
  state.results.push({ category: card.category, correct });
  state.index += 1;
  if (state.index >= state.cards.length) finish();
  else renderCard();
}

function finish() {
  const summary = scoreSummary(state.results);
  $('score-total').textContent = `${summary.total.correct} / ${summary.total.total} correct`;
  const bd = $('score-breakdown');
  bd.innerHTML = '';
  for (const cat of Object.keys(summary.byCategory).sort()) {
    const slot = summary.byCategory[cat];
    const row = document.createElement('div');
    row.className = 'score-row';
    row.innerHTML = `<span>${cat}</span><span class="pct">${slot.correct} / ${slot.total}</span>`;
    bd.appendChild(row);
  }
  show('score');
}

function restart() {
  $('count-input').dataset.userTouched = '';
  state.selected = new Set(Object.keys(categoryCounts(FLASHCARDS_DATA)));
  renderChips();
  syncCountDefault();
  show('setup');
}

$('count-input').addEventListener('input', () => {
  $('count-input').dataset.userTouched = '1';
  $('start-btn').disabled = availableInSelection() === 0 || Number($('count-input').value) <= 0;
});
$('start-btn').addEventListener('click', startReview);
$('reveal-btn').addEventListener('click', reveal);
$('good-btn').addEventListener('click', () => rate(true));
$('bad-btn').addEventListener('click', () => rate(false));
$('restart-btn').addEventListener('click', restart);

state.selected = new Set(Object.keys(categoryCounts(FLASHCARDS_DATA)));
renderChips();
syncCountDefault();
</script>
</body>
</html>

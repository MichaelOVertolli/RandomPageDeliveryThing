<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex, nofollow">
<title>Characters</title>
<style>
  :root { --bg: #f7f3ea; --fg: #2b2620; --muted: #756c5f; --card: #fffdf8; --line: #e3dccd; --accent: #7a2e2e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1916; --fg: #ece5d8; --muted: #a39a8a; --card: #25221e; --line: #3a352e; --accent: #d08c5a; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.5 Georgia, "Times New Roman", serif; -webkit-text-size-adjust: 100%; }
  a { color: var(--accent); }
  .bar { position: sticky; top: 0; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px;
    padding: calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 10px calc(12px + env(safe-area-inset-left));
    background: var(--bg); border-bottom: 1px solid var(--line); }
  .bar h1 { margin: 0; font-size: 18px; text-align: center; }
  .back { font: 15px/1.2 system-ui, -apple-system, sans-serif; color: var(--accent); text-decoration: none; min-height: 44px; display: flex; align-items: center; }
  main, footer { max-width: 720px; margin: 0 auto; padding: 0 calc(14px + env(safe-area-inset-right)) 0 calc(14px + env(safe-area-inset-left)); }
  main { padding-top: 8px; padding-bottom: 24px; }
  .sub, .muted { color: var(--muted); margin: 6px 0; }
  .job { font-size: 19px; margin: 8px 0 10px; }
  .stats { margin: 4px 0; font-size: 15px; }
  h2 { font: 600 13px/1.2 system-ui, -apple-system, sans-serif; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
    margin: 20px 0 8px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  h3 { margin: 0 0 4px; font-size: 17px; }
  .buttons { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .btn { display: flex; flex-direction: column; justify-content: center; min-height: 52px; padding: 10px 14px; border-radius: 10px;
    background: var(--card); border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-size: 18px; }
  .btn span { color: var(--muted); font-size: 15px; }
  .btn:active { border-color: var(--accent); }
  .btn.small { min-height: 44px; font-size: 16px; }
  .children .buttons { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); margin-top: 16px; }
  .do { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 10px; padding: 2px 14px 8px; margin-top: 12px; }
  .do ol { margin: 0; padding-left: 22px; }
  .do li { margin: 6px 0; font-size: 18px; }
  .first ul, .if ul { margin: 0; padding-left: 20px; }
  .first li, .if li { margin: 6px 0; }
  .note { background: var(--card); border: 1px dashed var(--accent); border-radius: 10px; padding: 8px 12px; }
  details.other { margin-top: 20px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); padding: 0 12px; }
  details.other > summary { min-height: 48px; display: flex; align-items: center; cursor: pointer; font: 600 16px/1.2 system-ui, -apple-system, sans-serif; color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 10px 0; }
  .card p { margin: 4px 0; }
  .uses { color: var(--muted); font-weight: normal; font-size: 15px; }
  .spell .line { color: var(--muted); font-size: 15px; }
  .spell summary { cursor: pointer; color: var(--accent); font: 14px system-ui, -apple-system, sans-serif; padding: 6px 0; }
  footer { color: var(--muted); font-size: 13px; padding-top: 16px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
  footer a { word-break: break-all; }
  .banner { background: #b3261e; color: #fff; padding: 10px 14px; font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  .banner p { margin: 2px 0; }
</style>
</head>

</html>

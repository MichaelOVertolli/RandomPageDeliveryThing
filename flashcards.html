<script type="module">
// Stratified sample with largest-remainder rounding.
// Filters `cards` to categories in `selectedCategories`, then picks counts
// per category proportional to availability. Caps at per-category supply
// and at total availability. Tie-breaks on equal remainders by the order
// each category appears in `selectedCategories`.
export function stratifiedSample(cards, n, selectedCategories) {
  if (n === 0 || selectedCategories.length === 0) return [];

  const selected = new Set(selectedCategories);
  const filtered = cards.filter((c) => selected.has(c.category));
  if (filtered.length === 0) return [];

  const byCat = new Map();
  for (const cat of selectedCategories) byCat.set(cat, []);
  for (const c of filtered) byCat.get(c.category).push(c);

  const total = filtered.length;
  const effectiveN = Math.min(n, total);

  const entries = [];
  for (const [cat, list] of byCat) {
    if (list.length === 0) continue;
    const raw = (list.length / total) * effectiveN;
    const quota = Math.floor(raw);
    entries.push({ cat, list, quota, remainder: raw - quota });
  }

  let leftover =
    effectiveN - entries.reduce((sum, e) => sum + e.quota, 0);

  const order = entries
    .map((_, i) => i)
    .sort(
      (a, b) =>
        entries[b].remainder - entries[a].remainder || a - b,
    );

  for (const i of order) {
    if (leftover <= 0) break;
    if (entries[i].quota < entries[i].list.length) {
      entries[i].quota += 1;
      leftover -= 1;
    }
  }

  const out = [];
  for (const e of entries) {
    out.push(...e.list.slice(0, e.quota));
  }
  return out;
}

// Tallies a list of {category, correct} results into total + per-category counts.
export function scoreSummary(results) {
  const byCategory = {};
  let totalCorrect = 0;
  for (const r of results) {
    const slot = byCategory[r.category] || { correct: 0, total: 0 };
    slot.total += 1;
    if (r.correct) {
      slot.correct += 1;
      totalCorrect += 1;
    }
    byCategory[r.category] = slot;
  }
  return {
    total: { correct: totalCorrect, total: results.length },
    byCategory,
  };
}

// Fisher-Yates shuffle. Returns a new array; does not mutate input.
// `rng` must be a function returning a number in [0, 1).
export function shuffle(arr, rng) {
  const out = [...arr];
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}


const FLASHCARDS_DATA = [{"id": "q_0001_1", "question": "What four conditions must all be present simultaneously for an infection to occur?", "answer": "A pathogen must be present, there must be enough of it to cause disease, a person must be susceptible to it, and there must be a route of entry into the body.", "category": "Infection Control & Transmission"}, {"id": "q_0001_2", "question": "What makes sharp objects such as needles a particular risk for indirect contact transmission?", "answer": "If sharp objects have contacted the blood or bodily fluids of an infected person and are handled carelessly, they can pierce the skin and transmit infection.", "category": "Infection Control & Transmission"}, {"id": "q_0002_1", "question": "What bacterium causes tuberculosis?", "answer": "Tuberculosis is caused by the bacterium Mycobacterium tuberculosis.", "category": "Infection Control & Transmission"}, {"id": "q_0002_2", "question": "Through what routes of entry can HIV/AIDS be transmitted?", "answer": "HIV/AIDS enters through blood, semen, and vaginal fluid.", "category": "Infection Control & Transmission"}, {"id": "q_0002_3", "question": "How does airborne transmission of disease occur?", "answer": "Airborne transmission occurs when a person breathes in droplets that become airborne when an infected person coughs or sneezes, with heavy coughing increasing the risk of transmission.", "category": "Infection Control & Transmission"}, {"id": "q_0003_1", "question": "What three clinical conditions are encompassed by the general term COPD?", "answer": "COPD encompasses emphysema, chronic bronchitis, and bronchospasm. A patient may have all three, but one is usually most evident.", "category": "Respiratory Conditions & Emergencies"}, {"id": "q_0003_2", "question": "What happens to the alveoli in emphysema?", "answer": "The alveoli lose their elasticity and become distended with trapped air, causing the lungs to lose their ability to efficiently exchange carbon dioxide and oxygen.", "category": "Respiratory Conditions & Emergencies"}, {"id": "q_0003_3", "question": "How is vector-borne transmission defined, and what are two examples of diseases spread this way?", "answer": "Vector-borne transmission occurs when an animal, insect, or infected human transmits a pathogen into the body through a bite. Rabies and Lyme disease are transmitted this way.", "category": "Infection Control & Transmission"}, {"id": "q_0004_1", "question": "What is the clinical definition of chronic bronchitis?", "answer": "Chronic bronchitis is characterized by a productive cough that has persisted for at least 3 months per year over 2 consecutive years, often with narrowing of the bronchi and bronchioles.", "category": "Respiratory Conditions & Emergencies"}, {"id": "q_0004_2", "question": "How does bronchospasm affect the airways?", "answer": "In bronchospasm, the terminal bronchioles can swell and fill with fluid while the surrounding muscles contract, further narrowing the respiratory passages and causing shortness of breath and wheezing.", "category": "Respiratory Conditions & Emergencies"}, {"id": "q_0004_3", "question": "What distinguishes acute bronchitis from chronic bronchitis in terms of cause?", "answer": "Acute bronchitis is most often caused by infection and typically resolves in a few days, while chronic bronchitis is commonly caused by prolonged exposure to irritants such as cigarette smoke.", "category": "Respiratory Conditions & Emergencies"}, {"id": "q_0005_1", "question": "Why might a COPD patient develop a hypoxic drive to breathe instead of the normal carbon dioxide-based drive?", "answer": "COPD patients can maintain chronically high carbon dioxide levels, causing the body to stop using CO2 as the breathing trigger and instead rely on low oxygen levels to signal the need to breathe.", "category": "Respiratory Conditions & Emergencies"}, {"id": "q_0005_2", "question": "What is the physiological mechanism by which ARDS reduces oxygen absorption?", "answer": "ARDS causes fluid to accumulate between the alveolar membrane and the surrounding pulmonary capillaries, which decreases the amount of oxygen that red blood cells can absorb.", "category": "Respiratory Conditions & Emergencies"}, {"id": "q_0005_3", "question": "What is the correct field management for a COPD patient with a true hypoxic drive who is acutely short of breath?", "answer": "Administer high-flow oxygen, because EMS is typically called when the patient is acutely short of breath, making respiratory suppression from oxygen a rare concern in that context.", "category": "Respiratory Conditions & Emergencies"}, {"id": "q_0006_1", "question": "What is the most common condition that causes pulmonary edema?", "answer": "Congestive heart failure (CHF) is the most common condition to cause pulmonary edema.", "category": "Respiratory Conditions & Emergencies"}, {"id": "q_0006_2", "question": "What positioning should a patient with pulmonary edema be placed in, and why?", "answer": "The patient should sit upright and dangle their legs to encourage fluid to pool in the legs, reducing fluid accumulation in the lungs.", "category": "Respiratory Conditions & Emergencies"}, {"id": "q_0006_3", "question": "What is the most common origin of the embolus in pulmonary embolism?", "answer": "Pulmonary embolism most often results from a blood clot (thrombus) breaking free in the large veins of the lower extremities.", "category": "Respiratory Conditions & Emergencies"}, {"id": "q_0007_1", "question": "What are the recommended immediate and definitive care steps for a patient suspected of having a pulmonary embolism?", "answer": "Have the patient rest in a comfortable position, and definitive care requires hospitalization with thrombolytic or heparin therapy.", "category": "Respiratory Conditions & Emergencies"}, {"id": "q_0007_2", "question": "What is cardiovascular disease (CVD) and why is it clinically significant?", "answer": "CVD is a broad term for abnormal conditions affecting the heart and blood vessels, and it is one of the leading causes of death in Canada and worldwide; it also significantly increases the risk of life-threatening emergencies such as stroke and myocardial infarction.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0007_3", "question": "Which condition is described as a disease of the blood vessels supplying the heart muscle, and what is its alternate name?", "answer": "Coronary heart disease (CHD), also called coronary artery disease, is the disease of the blood vessels supplying the heart muscle.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0008_1", "question": "What term describes the condition in which cholesterol and plaque build up on the interior walls of arteries, causing them to harden, narrow, and lose elasticity?", "answer": "Arteriosclerosis, also called atherosclerosis.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0008_2", "question": "What is acute myocardial ischemia, and what two conditions can it result in?", "answer": "Acute myocardial ischemia is a significant reduction of blood flow to the heart muscle (myocardium); it can result in angina pectoris (chest pain) or myocardial infarction (heart attack).", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0008_3", "question": "Why does angina pectoris occur, and where can the resulting pain spread?", "answer": "Angina occurs when the heart's oxygen demand exceeds the available supply of oxygen-rich blood, such as during exertion or emotional stress; the constricting chest pain can spread to the neck, jaw, and arms.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0009_1", "question": "What is the key difference between stable angina and unstable angina?", "answer": "Stable angina follows a predictable pattern triggered by exercise or emotional stress and can be relieved with rest and medication, while unstable angina may occur at rest, last longer than 10 minutes, not respond to medication, or worsen in frequency and intensity.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0009_2", "question": "Why is nitroglycerin effective in treating angina?", "answer": "Nitroglycerin is a vasodilator that causes blood vessels to dilate, allowing oxygenated blood to flow more easily to the myocardium and reducing the heart's workload.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0009_3", "question": "What should a first responder do if they cannot determine whether a patient is experiencing angina or a myocardial infarction?", "answer": "They should treat the patient as if they are having a myocardial infarction, since the two conditions are difficult to distinguish in the field.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0010_1", "question": "What is the medical term for the death of heart muscle cells due to oxygen deprivation caused by a blocked coronary artery?", "answer": "Myocardial infarction (MI), also called a heart attack. When hypoxic myocardial cells begin to die (myocardial necrosis) due to a blocked coronary artery, this constitutes an MI.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0010_2", "question": "What type of chest pain is generally NOT associated with a myocardial infarction?", "answer": "Brief, stabbing chest pain or pain that intensifies when the patient bends or breathes deeply is usually not caused by an MI.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0010_3", "question": "What are two serious complications that can result from a myocardial infarction?", "answer": "An MI can interrupt the heart's electrical system, causing arrhythmias that prevent effective circulation, and it can lead to cardiac arrest if the heart is too damaged to continue beating.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0011_1", "question": "Which patient populations are more likely to present with 'soft signs' of a myocardial infarction rather than obvious chest pain?", "answer": "Soft signs — such as mild unfocused chest discomfort, fatigue, nausea, and vomiting — are more common among women, older adults, and patients with diabetes.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0011_2", "question": "What are the typical characteristics of chest pain associated with a myocardial infarction?", "answer": "The pain is often described as pressure, squeezing, tightness, aching, or a heavy sensation behind the sternum, and it is constant and not relieved by rest, position changes, or medication. It may radiate to the shoulder, arm, neck, or jaw.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0011_3", "question": "Why might a patient experiencing a myocardial infarction develop tachypnea?", "answer": "The body increases the breathing rate (tachypnea) in an attempt to deliver more oxygen to the heart, which is not working effectively.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0012_1", "question": "Why do many patients with myocardial infarction delay seeking medical care?", "answer": "Denial is a common reaction; nearly half of patients wait two or more hours before going to the hospital, often dismissing symptoms as indigestion or muscle soreness.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0012_2", "question": "What is a silent MI and who is most at risk?", "answer": "A silent MI is a myocardial infarction that goes unrecognized so advanced medical care is not obtained; it occurs most often in women, patients with diabetes, and older adults who experience soft signs.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0012_3", "question": "What duration of chest pain is a key indicator that a patient should be treated for myocardial infarction?", "answer": "Severe chest pain or discomfort lasting longer than 10 minutes is a key indicator that should not be ignored and warrants MI treatment.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0013_1", "question": "Why is acetylsalicylic acid (ASA) given to patients experiencing chest pain during a suspected myocardial infarction?", "answer": "ASA thins the blood and reduces clot formation, which can minimize damage to the heart muscle since most MIs result from blood clots in the coronary arteries.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0013_2", "question": "What are the contraindications for administering ASA to a patient suspected of having a myocardial infarction?", "answer": "ASA is contraindicated for patients with asthma or patients with bleeding conditions such as ulcers.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0014_1", "question": "What systolic blood pressure threshold is generally considered a contraindication for administering nitroglycerin?", "answer": "A systolic pressure lower than 100 mmHg is generally a contraindication for nitroglycerin.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0014_2", "question": "Why should a patient not take nitroglycerin if they have used tadalafil (Cialis) within the previous 48 hours?", "answer": "The combination of tadalafil and nitroglycerin can cause a fatal lowering of blood pressure.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0014_3", "question": "What is congestive heart failure (CHF) and what causes fluid to back up into the lungs or body tissues?", "answer": "CHF is an abnormal condition in which the heart's pumping ability is diminished, often caused by MI, valvular disease, or ischemic heart disease, resulting in fluid and blood backing up into the lungs or body tissues.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0015_1", "question": "Why does left-sided heart failure cause pulmonary edema?", "answer": "The left ventricle loses its ability to pump blood effectively, so blood from the lungs backs up into the left ventricle and fluid leaks into the lungs (pulmonary edema).", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0015_2", "question": "What is the most common cause of right-sided heart failure?", "answer": "Right-sided heart failure usually occurs due to left-sided heart failure, because when the left ventricle fails, increased fluid pressure is transferred back through the lungs until the right side can no longer keep up.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0015_3", "question": "Which sign of left-sided heart failure involves a patient's position affecting their breathing?", "answer": "Patients with left-sided heart failure have a history of severe shortness of breath when lying down that improves when standing, a symptom related to fluid redistributing into the lungs in the supine position.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0016_1", "question": "In right-sided heart failure, why does fluid pool in the extremities rather than the lungs?", "answer": "When the right side of the heart loses pumping power, blood backs up into the body's veins, causing fluid to pool in peripheral tissues — most noticeably in the feet and lower legs — rather than the pulmonary circulation.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0016_2", "question": "What body position is recommended for best assessing jugular venous distension (JVD)?", "answer": "JVD is most easily assessed with the patient in the Semi-Fowler's position, inclined 30 to 45 degrees.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0016_3", "question": "What is the difference between clinical death and cardiac arrest?", "answer": "Cardiac arrest is when the heart stops circulating blood (no pulse); clinical death is the cessation of both circulation and respiration, which may occur as a result of cardiac arrest but is potentially reversible through immediate interventions.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0017_1", "question": "What is the term for the irreversible damage caused by brain cell death following cardiac arrest?", "answer": "It is called biological death, which is irreversible.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0017_2", "question": "What is the most common cause of cardiac arrest in adults?", "answer": "Cardiovascular disease is the most common cause, with many cardiac arrests resulting from damage caused by myocardial infarctions (MIs).", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0017_3", "question": "What is the most common underlying cause of cardiac emergencies in infants and children, and why does it differ from adults?", "answer": "In infants and children, cardiac emergencies typically result from non-cardiac causes, most often respiratory arrest, because a child's heart is usually healthy unless it has a genetic abnormality.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0018_1", "question": "Why should defibrillator pads not be placed over a transdermal medication patch?", "answer": "The patch may block the transfer of defibrillation energy to the heart and can cause small burns on the skin; the area should be wiped clean before applying electrode pads.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0018_2", "question": "How far away from an implanted pacemaker or ICD must defibrillator electrodes be positioned?", "answer": "At least 2.5 cm (1 in.) away from the device.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0018_3", "question": "For the purposes of using a defibrillator, what age range defines a patient as a child?", "answer": "Between the ages of 1 and 8 years, regardless of the general clinical definition of childhood.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0019_1", "question": "What compression-to-ventilation ratio is used during neonatal resuscitation, and why does it differ from adult CPR?", "answer": "The ratio is 3:1 compressions to ventilations. Because cardiac arrest in neonates is almost always respiratory in origin rather than cardiac, there is greater emphasis on ventilations.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0019_2", "question": "What is the key difference between a transient ischemic attack (TIA) and a cerebrovascular accident (CVA)?", "answer": "A TIA is caused by a temporary restriction in blood flow that resolves when the blockage clears, usually without permanent tissue damage, whereas a CVA involves a sustained disruption of blood flow that causes lasting hypoxic damage to brain tissue.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0019_3", "question": "Why is defibrillation not indicated for neonatal patients?", "answer": "Because cardiac arrest in neonates is almost always respiratory in origin, not cardiac, making defibrillation inappropriate for this patient population.", "category": "Cardiac Emergencies & Resuscitation"}, {"id": "q_0020_1", "question": "What distinguishes a TIA from a full stroke in terms of symptom duration?", "answer": "In a TIA, signs and symptoms disappear within a few minutes or hours as the body clears the blockage, whereas in a CVA (stroke) the symptoms persist.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0020_2", "question": "What are the two main types of ischemic stroke, and how do they differ?", "answer": "Thrombotic strokes occur when a blood clot develops locally in a cerebral artery, often from plaque buildup; embolic strokes occur when material travels to the brain from elsewhere in the body.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0020_3", "question": "Why is a TIA considered a medical emergency even when symptoms resolve on their own?", "answer": "A TIA significantly increases the risk of a future CVA, and prompt treatment can identify the cause and allow for medication or surgery to prevent a full stroke.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0021_1", "question": "What are the two subtypes of hemorrhagic stroke, and where does bleeding occur in each?", "answer": "Intracerebral hemorrhage involves a blood vessel within the brain tissue bursting and spilling blood into the surrounding tissues. Subarachnoid hemorrhage involves an artery on the brain's surface bursting and spilling blood into the space between the brain and the skull.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0021_2", "question": "What is the most common type of embolus responsible for embolic strokes?", "answer": "The most common type is a blood clot that forms in diseased carotid blood vessels or from abnormally contracting heart chambers, then detaches and travels to the brain.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0021_3", "question": "Why does a subarachnoid hemorrhage often present as a sudden severe headache?", "answer": "Because an artery on the surface of the brain bursts and spills blood into the subarachnoid space between the brain and the skull, with the headache typically reaching peak intensity within a few seconds.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0022_1", "question": "When positioning a stroke patient in the recovery position who has weakness or paralysis on one side, which side of the body should face downward?", "answer": "The affected (weakened or paralyzed) side of the body should be positioned downwards.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0022_2", "question": "Why is the time of symptom onset important to communicate when notifying the hospital about a CVA patient?", "answer": "Treatment must be planned around symptom onset time, particularly because thrombolytic therapy eligibility depends on how long ago symptoms began.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0023_1", "question": "What does the 'T' in the FAST acronym stand for when assessing a suspected stroke?", "answer": "TIME — when signs and symptoms first appeared (or when the person was last known to be well), and also the urgency of care, since thrombolytic drugs are only effective in a short window after symptom onset.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0023_2", "question": "What is the arm weakness test in the Cincinnati Pre-hospital Stroke Scale, and what constitutes an abnormal result?", "answer": "The patient closes both eyes and holds both arms out straight for 10 seconds. An abnormal result is when one arm does not move or the arms drift unequally.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0023_3", "question": "In the Cincinnati Pre-hospital Stroke Scale speech test, what qualifies as an abnormal response?", "answer": "The patient uses incorrect words, slurs the words, or does not speak at all when asked to repeat a familiar saying.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0024_1", "question": "What distinguishes obstructive shock from cardiogenic shock?", "answer": "In obstructive shock the heart may be pumping normally but something physically prevents it from filling or emptying effectively (e.g., a pulmonary embolism or tension pneumothorax), whereas cardiogenic shock results from a problem with the heart itself.", "category": "Shock"}, {"id": "q_0024_2", "question": "What is the difference between true hypovolemic shock and relative hypovolemic shock?", "answer": "True hypovolemic shock involves an actual reduction in the body's total blood volume, while relative (distributive) hypovolemic shock occurs when dilated blood vessels cause blood to pool in the extremities, reducing effective circulation without a loss of total volume.", "category": "Shock"}, {"id": "q_0024_3", "question": "How does psychogenic shock differ from neurogenic shock in cause and mechanism?", "answer": "Both are forms of distributive shock where blood vessels dilate and blood pools in the extremities, but neurogenic shock is caused by an injury to the brain or spine that disrupts nervous system control of vessel constriction, whereas psychogenic shock is triggered by emotional stress with a psychological rather than neurological origin.", "category": "Shock"}, {"id": "q_0025_1", "question": "Why does the skin become pale and cool during compensated shock?", "answer": "Blood vessels constrict to focus blood toward vital organs, reducing circulation to the extremities and skin, which causes the skin to become pale and cool.", "category": "Shock"}, {"id": "q_0025_2", "question": "How does anaphylactic shock reduce circulating blood volume?", "answer": "Anaphylaxis increases the permeability of blood vessels, allowing fluid to leech out of the circulatory system and thereby reducing the volume of circulating blood.", "category": "Shock"}, {"id": "q_0025_3", "question": "What are the three distinct stages a patient in shock progresses through?", "answer": "Compensated, decompensated, and irreversible.", "category": "Shock"}, {"id": "q_0026_1", "question": "What is the Trendelenburg position and when is it contraindicated in shock care?", "answer": "The Trendelenburg position (also called the shock position) involves placing the patient supine with feet elevated 20 to 30 cm to improve blood flow to the head and torso. It is contraindicated when the patient has experienced trauma stressing the cardiovascular system or when systolic blood pressure exceeds 100 mmHg.", "category": "Shock"}, {"id": "q_0026_2", "question": "What distinguishes irreversible shock from decompensated shock?", "answer": "In irreversible shock, damage to the brain, heart, and other tissues is so extensive that the patient will not survive regardless of any interventions performed. In decompensated shock, immediate interventions may still reverse the effects.", "category": "Shock"}, {"id": "q_0026_3", "question": "What respiratory and circulatory signs indicate that compensatory shock mechanisms have failed?", "answer": "Respiration becomes slow, shallow, and irregular; the pulse becomes weak and rapid; and blood pressure drops. Cyanosis may appear around the lips and eyes, and the patient may become confused, listless, or unresponsive.", "category": "Shock"}, {"id": "q_0027_1", "question": "What cleaning agent is recommended for minor wounds, and why are soap and alcohol discouraged?", "answer": "Water alone is recommended for cleaning minor wounds. Soap and alcohol can cause damage to sensitive tissues under the skin.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0027_2", "question": "When a wound is hemorrhaging or involves extensive tissue damage, what takes priority over cleaning?", "answer": "Bleeding control and rapid transport are higher priorities than cleaning for severe wounds, which will be cleaned thoroughly at the medical facility.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0027_3", "question": "What is the correct direction to wipe when cleaning the area around an open wound?", "answer": "Always wipe away from the wound, not towards it, to reduce the risk of infection.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0028_1", "question": "Where on the limb should a tourniquet be applied relative to the injury?", "answer": "5 to 10 cm (2 to 4 in.) above the injury and just above any joint in that range.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0028_2", "question": "Why should a tourniquet be used only as a last resort for hemorrhage control?", "answer": "Because it completely blocks blood flow to the extremity for the entire time it is in place, which can cause serious complications for the patient.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0028_3", "question": "How does a hemorrhage differ from minor bleeding in terms of the body's response?", "answer": "Minor bleeding is usually stopped by the body's clotting response within 10 minutes, especially with applied pressure, whereas a hemorrhage overwhelms those responses and can rapidly lead to hemorrhagic shock.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0029_1", "question": "Why is arterial bleeding harder to control than venous or capillary bleeding?", "answer": "Arterial blood is under direct pressure from the heart, so it spurts from the wound, making it difficult for clots to form.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0029_2", "question": "How does the colour of arterial blood differ from venous blood, and what causes the difference?", "answer": "Arterial blood is bright red due to its high oxygen concentration, while venous blood is dark red or maroon because it is oxygen-poor.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0029_3", "question": "What is the first-line technique for controlling minor to moderate external bleeding?", "answer": "Applying direct pressure with a gloved hand directly on the wound, which compresses blood vessels, restricts blood flow, and allows clotting to occur.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0030_1", "question": "When blood soaks through a dressing applied to an external wound, what is the correct action?", "answer": "Add additional dressings and bandages on top. Do not remove any blood-soaked dressings or bandages.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0030_2", "question": "What are the common causes of epistaxis (nosebleed) beyond blunt force trauma?", "answer": "High blood pressure and changes in altitude can also cause epistaxis.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0030_3", "question": "How should a patient be positioned and managed to control an epistaxis once bleeding has stopped?", "answer": "Have the patient sit with the head slightly forward while pinching the nostrils together; afterward, instruct the patient to avoid rubbing, blowing, or picking the nose to prevent restarting the bleeding.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0031_1", "question": "In patients with hypertension or blood-thinning medication, why can epistaxis (nosebleed) become life-threatening?", "answer": "These conditions make the bleeding harder to control quickly, and if it cannot be controlled rapidly, the patient may experience severe blood loss requiring emergency transport.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0031_2", "question": "What is the clinical threshold for classifying a nosebleed as uncontrollable bleeding requiring transport to a medical facility?", "answer": "If the bleeding cannot be controlled within 10 to 15 minutes, or if it repeatedly stops and recurs in a short period, it is considered uncontrollable and the patient should be transported.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0031_3", "question": "Why should an EMT suspect internal bleeding in a motorcycle rider even when no external hemorrhaging is visible?", "answer": "The violent forces involved in the mechanism of injury indicate that serious internal injuries are likely, and internal bleeding is more difficult to recognize than external bleeding.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0032_1", "question": "What signs and symptoms may indicate possible internal bleeding?", "answer": "Signs of possible internal bleeding include bruising or discoloration of the skin, soft tissues that are tender or swollen, a rapid weak pulse, a drop in blood pressure, rapid breathing, cool or pale skin, anxiety, nausea, excessive thirst, or a declining level of responsiveness.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0032_2", "question": "What is the appropriate first aid for suspected internal hemorrhaging versus minor internal bleeding such as a bruise?", "answer": "For minor internal bleeding like a bruise, apply ice or a cold pack (with a barrier between skin and cold source) to reduce pain and swelling. For suspected internal hemorrhaging, there is little an EMR can do — the patient must be transported to a hospital immediately for advanced care, often requiring surgery.", "category": "Bleeding & Hemorrhage Control"}, {"id": "q_0032_3", "question": "What are the four main types of open wounds?", "answer": "The four main types of open wounds are abrasions, lacerations, avulsions, and punctures.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0033_1", "question": "Why are abrasions particularly susceptible to infection compared to other open wounds?", "answer": "Abrasions expose the skin's surface to the environment, allowing dirt and other matter to become easily embedded in the skin during the injury.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0033_2", "question": "Why may a laceration not be immediately painful even though it is a significant wound?", "answer": "Because the nerves in the area may also be injured by the laceration, pain sensation can be absent or delayed.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0033_3", "question": "What are the two primary care priorities when treating an avulsion?", "answer": "Bleeding control and infection control are the primary priorities when caring for an avulsion.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0034_1", "question": "Why are puncture wounds considered dangerous even when external bleeding is not severe?", "answer": "Puncture wounds carry a high risk of infection because penetrating objects introduce micro-organisms (such as those causing tetanus) into deeper tissues where low-oxygen environments allow them to thrive.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0034_2", "question": "What should an EMR look for when treating a patient injured by a firearm?", "answer": "The EMR should look for both an entry and an exit point for the bullet; if no exit point is found, the bullet may still be inside the patient.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0034_3", "question": "What is an impaled object?", "answer": "An impaled object is an object that remains lodged in an open wound after penetrating the skin.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0035_1", "question": "When should a large impaled object be left in the wound rather than removed?", "answer": "A large impaled object should be left in place unless it interferes with the patient's airway or respiration, because moving it can damage internal structures and cause or worsen bleeding.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0035_2", "question": "How can a wood sliver be made more visible against a patient's skin before removal?", "answer": "Wet the area with a coloured antiseptic solution such as iodine for 30 seconds, then gently wipe away the remaining liquid; the sliver will have absorbed some of the liquid, making it easier to see.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0035_3", "question": "At what angle should a sliver be drawn out when using forceps to remove it?", "answer": "The sliver should be drawn out at the same angle at which it entered the skin.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0036_1", "question": "When should a fish hook NOT be removed in the field, and what should be done instead?", "answer": "A fish hook should not be removed if doing so might injure vital structures such as muscles or nerves around the eye. In that case, immobilize the hook and transport the patient to a medical facility for removal.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0036_2", "question": "What four sources can cause a burn?", "answer": "Burns can be caused by heat, chemicals, electricity, or radiation.", "category": "Burns"}, {"id": "q_0036_3", "question": "What factors determine the severity of a burn?", "answer": "Severity depends on the intensity of the source, length of exposure, location of the burn, extent of the burn, the patient's age, and the patient's underlying medical conditions.", "category": "Burns"}, {"id": "q_0037_1", "question": "Which patient age groups are at higher risk for more severe burns due to thinner skin?", "answer": "Patients under age 5 and over age 60 have thinner skin and tend to burn more severely.", "category": "Burns"}, {"id": "q_0037_2", "question": "What are the three depth classifications of burns?", "answer": "Burns are classified as superficial, partial-thickness, and full-thickness, with deeper burns affecting more tissue types and being more severe.", "category": "Burns"}, {"id": "q_0037_3", "question": "What are the characteristics of a superficial (first-degree) burn?", "answer": "A superficial burn involves only the top skin layer, presenting as red, dry, and usually painful skin that may swell, and it generally heals in 5 to 6 days without permanent scarring.", "category": "Burns"}, {"id": "q_0038_1", "question": "What distinguishes a partial-thickness burn from a full-thickness burn in terms of tissue depth affected?", "answer": "A partial-thickness burn involves both the epidermis and dermis, while a full-thickness burn destroys the epidermis, dermis, and any underlying structures including fat, muscles, bones, and nerves.", "category": "Burns"}, {"id": "q_0038_2", "question": "Why are full-thickness burns considered life-threatening beyond the immediate tissue damage?", "answer": "Full-thickness burns cause fluid loss from open wounds, reducing blood volume and creating serious risk of hypovolemic shock, and they also make the body highly vulnerable to infection.", "category": "Burns"}, {"id": "q_0038_3", "question": "What makes a burn 'critical' in an emergency medical context?", "answer": "A critical burn is one likely to be life-threatening, disfiguring, or disabling, and includes any full-thickness burn of any size or a partial-thickness burn covering more than 10% of the body.", "category": "Burns"}, {"id": "q_0039_1", "question": "According to the Rule of Nines, what percentage of the body surface area does the head and neck represent in an adult versus an infant?", "answer": "In an adult, the head and neck represent 9% of the body's total surface area. In an infant, the head and neck represent 18%.", "category": "Burns"}, {"id": "q_0039_2", "question": "Using the Rule of Nines, how would you estimate the total body surface area burned for a patient with burns to the front of the trunk and one entire arm?", "answer": "The anterior trunk equals 18% and one entire arm equals 9%, so you would estimate 27% of the body surface area is burned.", "category": "Burns"}, {"id": "q_0039_3", "question": "Which types of burns on any patient always require emergency medical attention regardless of size?", "answer": "Burns from chemicals, explosions, or electricity always require emergency care, as do burns around the mouth or nose, burns causing respiratory difficulty, burns causing unresponsiveness, and any burns on children or older adults.", "category": "Burns"}, {"id": "q_0040_1", "question": "How does the Rule of Palms estimate the extent of a burn?", "answer": "The palm of the patient's hand equals roughly 1% of their body surface area, so burns covering an area equivalent to a certain number of palms are estimated as that many percent of the body.", "category": "Burns"}, {"id": "q_0040_3", "question": "What are the three basic care steps that should be performed for any burn regardless of type?", "answer": "Prevent additional tissue damage, cover the burned area with dry dressings, and take steps to manage shock.", "category": "Burns"}, {"id": "q_0041_1", "question": "Why should ointments, butter, or cooking oil never be applied to a burn wound?", "answer": "These substances seal in heat and cause infections by contaminating open skin areas, making the burn worse rather than relieving pain.", "category": "Burns"}, {"id": "q_0041_2", "question": "Under what specific condition is it acceptable to cover a burn with a moist dressing rather than a dry one?", "answer": "Only for small burns covering less than 10% of the body, and only if the moist dressing reduces pain for the patient.", "category": "Burns"}, {"id": "q_0041_3", "question": "Why are patients with full-thickness or large partial-thickness burns at risk for shock?", "answer": "Pain and fluid loss from these burns can cause shock, and affected patients also lose body heat easily, making temperature management important.", "category": "Burns"}, {"id": "q_0042_1", "question": "Why should thermal burns be cooled even after the heat source has been removed?", "answer": "Soft tissue continues to burn for several minutes after the heat source is removed, causing further damage, so immediate and thorough cooling is essential.", "category": "Burns"}, {"id": "q_0042_2", "question": "Why do burns involving hot grease or clothing pose a particularly high risk of serious injury?", "answer": "Hot grease is slow to cool and hard to remove, while clothing traps heat against the skin; some synthetic fabrics can also melt and stick to the skin, prolonging heat contact.", "category": "Burns"}, {"id": "q_0042_3", "question": "How long should a thermal burn be cooled with water, and what method is preferred?", "answer": "A burn should be cooled for at least 10 minutes, and immersion in cool water is preferred over running water to reduce the risk of tissue damage.", "category": "Burns"}, {"id": "q_0043_1", "question": "Why should you cool only a small area at a time when treating a large burn rather than cooling the entire burn at once?", "answer": "Cooling a large area increases the risk of cold stress and hypothermia, which is especially dangerous in children who have higher susceptibility to hypothermia.", "category": "Burns"}, {"id": "q_0043_2", "question": "What signs may indicate that a patient has sustained inhalation injuries to the airway or lungs?", "answer": "The presence of soot, thermal burns around the mouth or nose, singed hair, and/or singed eyebrows may signal that the patient's air passages or lungs have been burned.", "category": "Burns"}, {"id": "q_0043_3", "question": "What are common household sources of caustic chemicals that can cause chemical burns?", "answer": "Common sources include household bleach, oven or drain cleaners, toilet bowl cleaners, paint strippers, and lawn or garden treatments, typically strong acids or alkalis.", "category": "Burns"}, {"id": "q_0044_1", "question": "How long should you flush a chemical burn with cool running water?", "answer": "You should flush continuously for at least 20 minutes. If the chemical is a powder or granules, brush it off the skin before flushing.", "category": "Burns"}, {"id": "q_0044_2", "question": "What special technique should be used when flushing a chemical burn to the eye?", "answer": "Flush the affected eye from the nose outward and angle the patient's head so the chemical is not washed into the other eye or onto unaffected skin.", "category": "Burns"}, {"id": "q_0044_3", "question": "What determines the severity of a chemical burn?", "answer": "The severity depends on the strength of the chemical and the duration of its contact with the body, since the chemical continues to burn as long as it remains on the skin.", "category": "Burns"}, {"id": "q_0045_1", "question": "Why should you look for two burn sites when assessing a patient with electrical burns?", "answer": "Electrical injuries often have characteristic entry and exit burns marking where the current entered and left the body, so two sites indicate the current's path through the body.", "category": "Burns"}, {"id": "q_0045_2", "question": "What life-threatening conditions should be suspected in a patient who has been electrocuted, especially by a lightning strike?", "answer": "Respiratory or cardiac arrest, spinal injuries, and other fractures should all be suspected due to the powerful forces involved.", "category": "Burns"}, {"id": "q_0045_3", "question": "How should a radiation burn such as a sunburn be treated in the field?", "answer": "Cool the burn and protect the area from further damage by avoiding further exposure to sunlight, treating it the same as a thermal burn.", "category": "Burns"}, {"id": "q_0046_1", "question": "Why is bleeding from an amputation often less severe than expected, and how does the body respond initially?", "answer": "Although initial bleeding is often heavy, blood vessels constrict and retract from the amputation site, slowing bleeding and making it easier to control with direct pressure.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0046_2", "question": "What is the correct procedure for preserving an amputated body part to maximize the chance of surgical reattachment?", "answer": "Rinse the part with saline, wrap it in sterile gauze, place it in a plastic bag inside a larger bag cooled with ice or chemical cold packs, and label the bag with the patient's name, date, and time.", "category": "Wound & Soft-Tissue Care"}, {"id": "q_0047_1", "question": "What is crush syndrome and what causes it to develop?", "answer": "Crush syndrome occurs when tissues subjected to crushing forces for typically more than 1 hour become hypoxic and produce toxins like lactic acid anaerobically; when the crushing object is removed, these toxins circulate through the body, often causing impaired heart function and renal failure.", "category": "Musculoskeletal Injuries & Splinting"}, {"id": "q_0047_2", "question": "Why does compartment syndrome disrupt blood flow to muscle and nerve cells?", "answer": "When pressure within a muscle compartment exceeds the blood pressure inside the capillaries, the capillaries collapse, cutting off the supply of oxygen and nutrients to muscle and nerve cells, which begin to die within hours.", "category": "Musculoskeletal Injuries & Splinting"}, {"id": "q_0047_3", "question": "What are the potential consequences if compartment syndrome pressure is not relieved quickly?", "answer": "Without rapid pressure relief, compartment syndrome can cause permanent disability or death.", "category": "Musculoskeletal Injuries & Splinting"}, {"id": "q_0048_1", "question": "What does numbness or paralysis in compartment syndrome indicate?", "answer": "It indicates that cell death has begun, and efforts to lower pressure in the compartment may not be successful in restoring function to the muscle.", "category": "Musculoskeletal Injuries & Splinting"}, {"id": "q_0048_2", "question": "What is the RICE acronym used for in the general care of musculoskeletal injuries?", "answer": "RICE stands for Rest, Immobilize, Cold, and Elevate — the four steps of general care for musculoskeletal injuries.", "category": "Musculoskeletal Injuries & Splinting"}, {"id": "q_0048_3", "question": "Why should excessive pressure be avoided when controlling bleeding from a fractured bone?", "answer": "Movement or excessive pressure on a fractured bone can cause additional tissue damage beyond the fracture itself.", "category": "Musculoskeletal Injuries & Splinting"}, {"id": "q_0049_1", "question": "What is the correct order of steps when applying cold to a musculoskeletal injury?", "answer": "Immobilize the injured part first, then apply ice or a cold pack; cold should not be applied before the injury is stabilized.", "category": "Musculoskeletal Injuries & Splinting"}, {"id": "q_0049_2", "question": "Why should ice or a cold pack not be placed directly over a fracture site?", "answer": "The pressure of a cold pack placed directly over a fracture can cause discomfort to the patient; cold packs should instead be placed around the injury site.", "category": "Musculoskeletal Injuries & Splinting"}, {"id": "q_0049_3", "question": "Why is immobilizing a femur fracture especially important before moving the patient?", "answer": "Fractures of large bones like the femur can cause internal hemorrhaging, which may lead to shock.", "category": "Musculoskeletal Injuries & Splinting"}, {"id": "q_0050_1", "question": "Why should a patient with a fractured femur always be placed in the rapid transport category?", "answer": "Because a femur fracture can damage the femoral artery, causing rapidly life-threatening internal hemorrhage.", "category": "Musculoskeletal Injuries & Splinting"}, {"id": "q_0050_2", "question": "What characteristic deformity can result from a fractured femur due to thigh muscle contraction?", "answer": "The thigh muscles can pull the broken bone ends together causing them to overlap, making the injured leg noticeably shorter than the other leg, and the leg may also be turned outward.", "category": "Musculoskeletal Injuries & Splinting"}, {"id": "q_0050_3", "question": "How should a traction splint be applied to a patient with a fractured femur?", "answer": "Apply a long rigid splint from the axilla (armpit) to the foot on the lateral side, and a second rigid splint on the medial side from the groin to the bottom of the foot or just beyond.", "category": "Musculoskeletal Injuries & Splinting"}, {"id": "q_0051_1", "question": "What is the difference between an open and a closed chest wound?", "answer": "An open chest wound occurs when an object penetrates the chest wall or fractured ribs break through the skin. A closed chest wound is one where the skin is not broken, generally caused by blunt force.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0051_2", "question": "When is securing an injured leg to the uninjured leg (anatomical splinting) appropriate?", "answer": "It should only be used in a rapid transport situation when speed is crucial.", "category": "Musculoskeletal Injuries & Splinting"}, {"id": "q_0051_3", "question": "Which sign of a serious chest injury involves abnormal chest wall motion?", "answer": "Unequal or paradoxical movement of the chest wall is a sign of serious chest injury.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0052_1", "question": "What patient behaviors should make you suspect a rib fracture?", "answer": "Suspect a rib fracture if the patient's breathing is painful and shallow, if they lean toward the side of the fracture to ease pain, or if they press on the injured area to stabilize it.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0052_2", "question": "Why are multiple rib fractures considered more dangerous than a simple rib fracture?", "answer": "Multiple rib fractures often cause internal hemorrhaging and difficulty breathing (dyspnea), which creates a risk of shock, making them potentially life-threatening.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0052_3", "question": "What are the steps for caring for a suspected rib fracture?", "answer": "Position the patient in a Semi-Fowler's position to aid respiration, support and immobilize the injured area with a soft bulky object such as a pillow, and provide interventions for respiratory distress if needed (e.g., supplemental oxygen or assisted ventilations).", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0053_1", "question": "What is paradoxical movement in the context of a flail chest injury?", "answer": "Paradoxical movement is when the flail segment moves in the opposite direction from the rest of the chest wall — inward during inhalation and outward during exhalation.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0053_2", "question": "How should a flail chest injury be stabilized in the field?", "answer": "Place bulky dressings at least 1.3 cm thick over the entire injured area, extending beyond the segment's edges on all sides, then secure them with long strips of tape.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0053_3", "question": "What is hemothorax and what causes it?", "answer": "Hemothorax is bleeding into the pleural space around the lungs, caused by blunt or penetrating chest trauma that lacerates the lung or a blood vessel; it can occur with either open or closed chest wounds.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0054_1", "question": "What type of pneumothorax occurs without any associated trauma, and who is most commonly affected?", "answer": "Spontaneous pneumothorax occurs without associated trauma and is most frequently seen in young, thin, tall males.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0054_2", "question": "What is the defining characteristic of a simple pneumothorax?", "answer": "A simple pneumothorax involves a one-time escape of air into the pleural space, which may partially or totally collapse the lung.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0054_3", "question": "Why should a patient with a hemothorax resulting from penetrating chest injury also be assessed for open pneumothorax interventions?", "answer": "Penetrating chest injuries can cause both hemothorax and open pneumothorax simultaneously, so both conditions may need to be treated.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0055_1", "question": "How does tension pneumothorax differ from a simple pneumothorax?", "answer": "A simple pneumothorax involves a single entry of air into the pleural space, while tension pneumothorax occurs when torn lung tissue causes a continual flow of air into the pleural space, producing a steady increase in pressure that eventually collapses the lung.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0055_2", "question": "What are the accompanying signs of tension pneumothorax as pressure mounts in the pleural space?", "answer": "Signs include tachycardia, hypotension, tracheal deviation, jugular venous distension (JVD), and eventually signs of hypoxia and severe respiratory distress.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0055_3", "question": "What is subcutaneous emphysema and what distinguishes it on physical examination?", "answer": "Subcutaneous emphysema (SCE) is a rare condition where air becomes trapped in tissues beneath the skin, causing swelling and an unusual crackling sensation when the affected area is touched.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0056_1", "question": "What is the primary sign of a penetrating chest injury?", "answer": "A sucking sound heard coming from the wound with each inhalation, referred to as a sucking chest wound.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0056_2", "question": "Why must a penetrating chest wound be prevented from becoming occluded?", "answer": "Occlusion prevents air from entering or exiting the wound and significantly increases the risk of a tension pneumothorax.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0056_3", "question": "What two conditions can result when a puncture wound allows air or blood to enter the chest cavity?", "answer": "Pneumothorax (air in the chest cavity) or hemothorax (blood in the chest cavity).", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0057_1", "question": "Why are abdominal injuries often considered life-threatening compared to chest injuries?", "answer": "Unlike the chest, the abdomen lacks a protective cage of bone, making it more susceptible to injury. It also contains many vital organs that tend to bleed profusely when damaged.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0057_2", "question": "What two dangers does a liver injury pose beyond blood loss?", "answer": "A damaged liver can cause severe hemorrhage and can also leak bile into the abdomen, which may lead to severe infection.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0057_3", "question": "Why is a splenic injury capable of causing rapid, life-threatening blood loss?", "answer": "The spleen stores blood, so when it ruptures from blunt force trauma, the stored blood is quickly lost, leading to severe hemorrhage.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0058_1", "question": "Why should an EMR suspect serious abdominal injury even when external signs are absent or the patient reports no pain?", "answer": "Blunt trauma to the abdomen may not cause external signs of injury and can be painless even when serious injuries have occurred, so the mechanism of injury (MOI) should guide suspicion.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0058_2", "question": "What patient position is recommended when caring for an abdominal injury, and why?", "answer": "The patient should be placed supine with knees slightly bent, supported by rolled blankets or pillows, to allow the abdominal muscles to relax.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0058_3", "question": "What complication can develop in the hours or days after a penetrating abdominal wound beyond immediate hemorrhage?", "answer": "The patient may develop peritonitis, an infection of the abdominal lining, in the hours or days following the event.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0059_1", "question": "What should you do when abdominal organs are protruding through an open wound?", "answer": "Cover the organs lightly with moist, sterile dressings placed loosely over the wound, then cover with plastic wrap if available and a folded towel or blanket for warmth. Do not touch the organs or attempt to force them back into place.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0059_2", "question": "Why might older adults mistake an abdominal aortic aneurysm for renal colic?", "answer": "Because the pain pattern of an AAA is quite similar to renal colic, making it easy to confuse the two conditions.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0059_3", "question": "What vascular sign may be present in a patient suspected of having an abdominal aortic aneurysm?", "answer": "The patient may have absent or decreased femoral or pedal pulses on both sides of the body.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0060_1", "question": "What signs and symptoms distinguish a ruptured abdominal aortic aneurysm (AAA) from an intact one?", "answer": "A ruptured AAA presents with signs and symptoms of internal bleeding and likely shock, in addition to findings such as a pulsating abdominal mass, diminished femoral or pedal pulses, and lower-extremity tingling or numbness.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0060_2", "question": "Why are pelvic fractures particularly dangerous in terms of internal injury?", "answer": "Fractured pelvic bones can puncture or lacerate internal organs and major blood vessels, causing severe internal hemorrhage, and can also damage nerves that pass through the pelvis, leading to bowel, bladder, and sexual dysfunction.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0060_3", "question": "What is the key handling principle when assessing a patient with a suspected pelvic injury?", "answer": "Minimize movement of the pelvis, because any motion increases the risk of damage to internal structures such as organs, blood vessels, and nerves.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0061_1", "question": "What three directions of pressure are applied during a three-plane pelvic stability assessment?", "answer": "Gentle pressure is applied first inwards, then upwards, and finally downwards, assessing the pelvic girdle, the pubis, and the sacral coccygeal spine in sequence.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0061_2", "question": "What are the three key indicators of a pelvic fracture?", "answer": "Pain, pelvic instability, and crepitus are the key indicators of a pelvic fracture.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0061_3", "question": "What are the care priorities for a patient with a pelvic injury?", "answer": "The priorities are to minimize additional damage, control external bleeding, and mitigate the effects of shock until the patient can be rapidly transported for advanced emergency interventions.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0062_1", "question": "What is the primary mechanism by which pelvic binding helps control internal hemorrhage in pelvic fractures?", "answer": "Pelvic binding stabilizes the pelvic ring, which encourages clot formation and thereby assists in controlling internal hemorrhage.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0062_2", "question": "For which type of pelvic fracture mechanism is pelvic binding NOT recommended?", "answer": "Pelvic binding is not recommended for patients who sustain fractures from low-energy or lateral impacts.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0063_1", "question": "When applying a makeshift pelvic binding using a folded sheet, where should the top edge of the sheet be positioned on the patient's body?", "answer": "The top of the sheet should be level with the iliac crest.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0063_2", "question": "After applying a pelvic binding device, what two things should be reassessed to confirm the binding has not caused harm?", "answer": "Sensation and distal circulation in the lower extremities should be reassessed, and then the binding should be periodically reassessed to ensure tension is maintained.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0063_3", "question": "Why should clamps securing a makeshift pelvic binding be positioned laterally rather than centrally?", "answer": "Clamps positioned laterally avoid obstructing X-ray views of the pelvis.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0064_1", "question": "Why should a log roll not be used when moving a patient with a suspected pelvic injury?", "answer": "Because manipulation and movement of an injured pelvis can cause severe damage; a scoop or clamshell stretcher is the preferred alternative.", "category": "Chest, Abdominal & Pelvic Trauma"}, {"id": "q_0064_2", "question": "What is intracranial pressure (ICP) and why does it occur after a brain injury?", "answer": "ICP is the buildup of pressure inside the skull caused by accumulating blood from ruptured vessels; because there is very little empty space in the skull, this blood buildup compresses brain tissue and can cause further damage.", "category": "Head & Spinal Injury Management"}, {"id": "q_0064_3", "question": "What is typically the first and most important sign of a serious head injury?", "answer": "An altered level of responsiveness, which can be assessed using the Glasgow Coma Scale.", "category": "Head & Spinal Injury Management"}, {"id": "q_0065_1", "question": "What is the classic progression of signs and symptoms seen in an epidural hematoma?", "answer": "The patient typically presents with a brief loss of responsiveness, followed by a period of regained responsiveness, and then a rapid decline in responsiveness.", "category": "Head & Spinal Injury Management"}, {"id": "q_0065_2", "question": "How does a subdural hematoma differ from an epidural hematoma in terms of the type of bleeding and its location?", "answer": "A subdural hematoma involves venous bleeding in the subdural space, whereas an epidural hematoma involves arterial bleeding between the skull and the dura mater.", "category": "Head & Spinal Injury Management"}, {"id": "q_0065_3", "question": "What space does a subarachnoid hematoma involve, and what is the normal function of that space?", "answer": "A subarachnoid hematoma involves arterial bleeding into the subarachnoid space, which is the area between the arachnoid membrane and the pia mater; this space normally circulates cerebrospinal fluid and protects the brain from serious injury.", "category": "Head & Spinal Injury Management"}, {"id": "q_0066_1", "question": "What is spinal motion restriction (SMR) and when should it be considered?", "answer": "SMR refers to any technique for limiting movement of a patient's neck and/or spine, done manually or with special equipment such as a cervical collar or backboard. It should be considered before extricating or transporting a patient when a head and/or spinal injury is suspected.", "category": "Head & Spinal Injury Management"}, {"id": "q_0066_2", "question": "What is the purpose of the Canadian C-Spine Rule?", "answer": "The Canadian C-Spine Rule is a process developed to simplify and standardize the assessment of patients with suspected spinal injuries, used by pre- and in-hospital emergency care providers to determine whether there is sufficient risk of spinal injury to warrant radiography and/or SMR.", "category": "Head & Spinal Injury Management"}, {"id": "q_0066_3", "question": "What causes an intracerebral hematoma and how does it behave over time?", "answer": "An intracerebral hematoma is caused by blunt or penetrating trauma that damages blood vessels within the brain itself. There is often more than one contusion, and they can enlarge over time, with neurological consequences depending on the location and size.", "category": "Head & Spinal Injury Management"}, {"id": "q_0067_2", "question": "What minimum criteria must all be true before the Canadian C-Spine Rule can be applied to a patient?", "answer": "The patient must have experienced trauma, be alert (GCS of 15), have stable vital signs, be 16 years old or older, have no acute paralysis, no known vertebral disease, and no previous C-spine surgery.", "category": "Head & Spinal Injury Management"}, {"id": "q_0067_3", "question": "Why did the practice of using spinal motion restriction on a large percentage of trauma patients fall out of favor?", "answer": "It was uncomfortable for patients and had the potential to aggravate existing injuries, so it is now reserved only for cases where the Canadian C-Spine Rule identifies a reasonable justification.", "category": "Head & Spinal Injury Management"}, {"id": "q_0068_1", "question": "According to the Canadian C-Spine Rule, which patient characteristics are considered high-risk factors requiring spinal motion restriction assessment?", "answer": "High-risk factors include being 65 years or older, having paresthesia in the extremities, or experiencing a dangerous mechanism of injury such as a fall from over 1 metre, axial load to the head, high-speed motor vehicle collision, motorized recreational vehicle collision, or a motor vehicle–bicycle collision.", "category": "Head & Spinal Injury Management"}, {"id": "q_0068_2", "question": "What low-risk factors suggest that a patient with a potential spinal injury is unlikely to require spinal motion restriction?", "answer": "Low-risk factors include a simple rear-end collision MOI, the patient being in a sitting position, the patient having walked at any point since the injury, no immediate onset of neck pain, and no midline C-spine tenderness.", "category": "Head & Spinal Injury Management"}, {"id": "q_0068_3", "question": "What is in-line stabilization and when is it used?", "answer": "In-line stabilization is a technique used to bring a patient's head into neutral alignment, where the chin is in line with the neck and the spine is straight. It can be performed on patients in various positions including supine, sitting, standing, and recovery position.", "category": "Head & Spinal Injury Management"}, {"id": "q_0069_1", "question": "Under what circumstances should in-line spinal stabilization NOT be attempted?", "answer": "It should not be attempted if the patient's head is severely angulated to one side, if the patient complains of pain, pressure, or muscle spasms in the neck when alignment begins, or if resistance is felt when attempting to align the head with the body.", "category": "Head & Spinal Injury Management"}, {"id": "q_0069_2", "question": "What is the correct sequence for rotating a patient's head during in-line stabilization?", "answer": "The head should be rotated along only one axis at a time — either up and down or left and right, never both simultaneously — and moved slowly and gently until the chin is aligned with the body's midline.", "category": "Head & Spinal Injury Management"}, {"id": "q_0069_3", "question": "When may a responder remove their hands from a manually stabilized head and neck?", "answer": "Hands must not be removed until the patient has been fully secured to a spinal motion restriction device, or until it is determined (within the responder's scope of practice) that spinal motion restriction is no longer needed.", "category": "Head & Spinal Injury Management"}, {"id": "q_0070_1", "question": "What is the preferred method of manual head stabilization for supporting a patient while a cervical collar is applied?", "answer": "The head grip is the preferred method. It involves kneeling behind the supine patient, placing elbows on the ground, and positioning hands on either side of the head with thumbs on the forehead, index and middle fingers on the cheekbone, and ring and little fingers below the ears.", "category": "Head & Spinal Injury Management"}, {"id": "q_0070_2", "question": "Why is trapezius squeeze (trap stabilization) preferred over the head grip when manual stabilization is needed for a longer period?", "answer": "The trapezius squeeze causes less fatigue for the responder compared to the head grip, making it more suitable for extended stabilization or when rolling a patient from a supine to a lateral position.", "category": "Head & Spinal Injury Management"}, {"id": "q_0071_1", "question": "What is the purpose of the modified trapezius stabilization technique compared to the standard trapezius squeeze?", "answer": "The modified trapezius stabilization is used when rolling a patient to a lateral position from either a supine or prone position, and may also be used in place of the trapezius squeeze when the patient is supine.", "category": "Head & Spinal Injury Management"}, {"id": "q_0071_2", "question": "When performing the sternal forehead grip, in what situation is it typically applied?", "answer": "The sternal forehead grip is typically used for transferring manual spinal restriction of a patient from one responder to another, specifically when the responder maintaining manual stabilization must release the patient.", "category": "Head & Spinal Injury Management"}, {"id": "q_0071_3", "question": "During the trapezius squeeze, how should the rescuer's hands be positioned relative to the patient's trapezius muscles?", "answer": "Thumbs point downward on the front of the trapezius muscles and fingers point along the long axis of the body parallel to the spine; the hands should not be turned to cradle the patient's neck.", "category": "Head & Spinal Injury Management"}, {"id": "q_0072_1", "question": "What is the purpose of arching the hand during the sternal forehead grip?", "answer": "Arching the hand raises the forearm, creating room for sandbags or other devices to be placed or removed from each side of the patient's neck, or for a partner to adjust their grip.", "category": "Head & Spinal Injury Management"}, {"id": "q_0072_2", "question": "When is the sternal/spinal grip used instead of the sternal forehead grip?", "answer": "The sternal/spinal grip is used when the patient is in a seated position, such as on the floor or in a vehicle.", "category": "Head & Spinal Injury Management"}, {"id": "q_0072_3", "question": "Why must a hard cervical collar always be used in conjunction with manual stabilization or a mechanical motion restriction device?", "answer": "Because cervical collars alone do not provide adequate spinal motion restriction (SMR); they reduce movement but cannot fully immobilize the head and neck on their own.", "category": "Head & Spinal Injury Management"}, {"id": "q_0073_1", "question": "What risk does a cervical collar that is too tall pose to a patient?", "answer": "A collar that is too tall may hyperextend the neck.", "category": "Head & Spinal Injury Management"}, {"id": "q_0073_2", "question": "How does Responder B determine the correct size of a hard cervical collar before applying it?", "answer": "Responder B measures the distance between the top of the patient's trapezius and the bottom of the patient's chin using their fingers, then matches that measurement to the manufacturer's sizing marks.", "category": "Head & Spinal Injury Management"}, {"id": "q_0073_3", "question": "Why must Responder A's fingertips not extend beyond the patient's earlobe during manual in-line stabilization when applying a hard cervical collar?", "answer": "If Responder A's fingertips extend beyond the earlobe, they will interfere with Responder B's ability to apply the collar.", "category": "Head & Spinal Injury Management"}, {"id": "q_0074_1", "question": "How many responders are required at minimum to log-roll a patient onto a backboard, and what is the preferred number?", "answer": "A minimum of two responders are required — one for in-line stabilization and one to position the board and roll the patient. It is preferable to use at least three responders when possible.", "category": "Head & Spinal Injury Management"}, {"id": "q_0074_2", "question": "What should be done with the head of a prone patient when rolling them into a supine position during spinal immobilization?", "answer": "The head should be kept in the position it was found during the roll; it may be moved into the neutral position using in-line stabilization once the roll is complete, if indicated.", "category": "Head & Spinal Injury Management"}, {"id": "q_0074_3", "question": "After applying a cervical collar, who must maintain in-line stabilization until the patient is fully secured to a spinal restriction device?", "answer": "Responder A maintains in-line stabilization throughout the process until the patient is fully secured to a spinal restriction device.", "category": "Head & Spinal Injury Management"}, {"id": "q_0075_1", "question": "When securing a patient to a backboard, in what order should the body regions be strapped down?", "answer": "Secure the chest first, followed by the pelvis and legs, and always secure the head last.", "category": "Head & Spinal Injury Management"}, {"id": "q_0075_2", "question": "Why must manual in-line stabilization be maintained until the very end of the backboarding process?", "answer": "Manual in-line stabilization must be maintained until the patient's head is fully secured to prevent spinal movement and reduce the risk of injury.", "category": "Head & Spinal Injury Management"}, {"id": "q_0075_3", "question": "Why might padding be needed under the body when placing a child on a backboard?", "answer": "Babies and children have proportionally large heads, so padding under the body helps maintain a neutral spinal position.", "category": "Head & Spinal Injury Management"}, {"id": "q_0076_1", "question": "What is the purpose of the groin/leg straps when securing a patient to an upper body motion restriction device?", "answer": "The groin/leg straps prevent the device from moving upward and prevent the lower end from moving laterally.", "category": "Head & Spinal Injury Management"}, {"id": "q_0076_2", "question": "In what situations would an upper body motion restriction device be preferred over a long backboard for cervical spine restriction?", "answer": "When a long backboard is not practical, such as in a confined space or inside a motor vehicle.", "category": "Head & Spinal Injury Management"}, {"id": "q_0076_3", "question": "How can a short board be used for an injured child?", "answer": "A short board can serve as a long backboard for an injured child due to the child's smaller size.", "category": "Head & Spinal Injury Management"}, {"id": "q_0077_1", "question": "Why are serious head and spinal injuries considered life-threatening emergencies beyond the risk of permanent paralysis?", "answer": "An injury to the brain can impair nerve signals for crucial body processes, potentially stopping the patient's respiration or heart.", "category": "Head & Spinal Injury Management"}, {"id": "q_0077_2", "question": "What is the primary reason a patient with a suspected head or spinal injury should be kept as still as possible?

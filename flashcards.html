", "answer": "Movement of an injured head or spine can cause irreversible damage to the spinal cord.", "category": "Head & Spinal Injury Management"}, {"id": "q_0077_3", "question": "When should a helmet be removed from a patient with a suspected spinal injury?", "answer": "A helmet should be removed when it interferes with necessary assessments or interventions, and it must be done correctly and safely to avoid causing further harm.", "category": "Head & Spinal Injury Management"}, {"id": "q_0078_1", "question": "What is the purpose of removing internal cheek pads or deflating the air bladder when removing a football helmet?", "answer": "These steps loosen the helmet's fit so it can be removed safely; cheek pads are removed using tongue depressors taped together, and the air bladder is deflated with a syringe or air pump.", "category": "Head & Spinal Injury Management"}, {"id": "q_0078_2", "question": "What does Responder A do while Responder B cuts away the straps during helmet and shoulder pad removal?", "answer": "Responder A provides manual stabilization of the patient's head and neck throughout the procedure.", "category": "Head & Spinal Injury Management"}, {"id": "q_0079_1", "question": "During football helmet and shoulder pad removal, what is Responder B's role when Responder A slides the helmet off?", "answer": "Responder B maintains manual stabilization from below the patient's head to prevent the head from tilting during helmet removal, and readjusts hand position under the head after the helmet clears the ears.", "category": "Head & Spinal Injury Management"}, {"id": "q_0079_2", "question": "In the two-responder helmet and shoulder pad removal technique, what does Responder A do after the shoulder pads are removed?", "answer": "Responder A takes over manual stabilization of the patient's head from Responder B and lowers it to the ground.", "category": "Head & Spinal Injury Management"}, {"id": "q_0079_3", "question": "How should Responder A remove the shoulder pads once the helmet has been taken off?", "answer": "Responder A places both hands on the sides of the neck opening of the shoulder pads and pulls straight back along the ground, bringing the shoulder pads up over the patient's head while taking care to clear them over the nose to avoid excessive cervical extension.", "category": "Head & Spinal Injury Management"}, {"id": "q_0080_1", "question": "Why is removing a football helmet and shoulder pads considered more difficult than removing a motorcycle helmet?", "answer": "Football helmet removal is a skilled technique requiring hours of practice and often multiple trained responders, and the patient is also wearing shoulder pads; a motorcycle helmet is less complex in design and is not paired with shoulder or chest pads.", "category": "Head & Spinal Injury Management"}, {"id": "q_0080_2", "question": "During a two-responder motorcycle helmet removal, what does Responder B do while Responder A maintains head stabilization in the early steps?", "answer": "Responder B loosens the strap at the D-rings, then places one hand on the patient's mandible and the other under the occipital region to maintain manual inline stabilization before Responder A slides the helmet off.", "category": "Head & Spinal Injury Management"}, {"id": "q_0080_3", "question": "Who should responders look to for assistance when helmet and shoulder pad removal is needed at an athletic event?", "answer": "The certified athletic therapist or trainer, who carries the necessary removal tools in their emergency kit.", "category": "Head & Spinal Injury Management"}, {"id": "q_0081_1", "question": "What is syncope and what causes it to occur?", "answer": "Syncope (fainting) occurs when the brain is suddenly deprived of its normal blood flow and momentarily shuts down. It can be triggered by pain, emotional shock, a drop in blood pressure or blood sugar, certain medications, standing for a long time, heat exposure, overexertion, or medical conditions such as heart disease.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0081_2", "question": "Which patient populations are more likely to experience syncope when suddenly changing positions?", "answer": "Pregnant women and older adults are more likely than other patients to experience syncope when suddenly changing positions, such as moving from lying down to standing up.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0082_1", "question": "What position should an unresponsive patient be placed in, and why should they not be allowed to eat or drink?", "answer": "An unresponsive patient should be placed in the supine position with suction equipment ready. Eating or drinking is prohibited because it can increase the chance of vomiting.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0082_2", "question": "Why does syncope often resolve on its own when a patient moves from standing or sitting to a reclining position?", "answer": "The position change allows normal circulation to the brain to resume, after which the patient usually regains responsiveness within minutes.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0082_3", "question": "Why should an EMR always conduct a thorough assessment of any patient who has experienced a loss of responsiveness, even if the patient recovers quickly?", "answer": "Any altered mental status can be an indicator of a serious underlying condition, so the rapid recovery does not rule out a significant problem requiring further assessment.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0083_1", "question": "What is the normal blood glucose level (BGL) range for a patient?", "answer": "A normal BGL is usually between 4 and 7 mmol/L.", "category": "Diabetic & Metabolic Emergencies"}, {"id": "q_0083_2", "question": "How should glucose gel be administered to an unresponsive patient with suspected hypoglycemia?", "answer": "Place approximately 12 grams (half a tube) of gel on the inside of the patient's lower cheek, spreading it as thoroughly as possible for faster absorption, while keeping the patient in the semi-prone position with suction ready.", "category": "Diabetic & Metabolic Emergencies"}, {"id": "q_0083_3", "question": "What action should be taken if a diabetic patient's signs and symptoms persist 5 to 10 minutes after the first dose of oral glucose?", "answer": "The patient should be placed in the rapid transport category, given a second dose of glucose, and supplemental oxygen should also be provided.", "category": "Diabetic & Metabolic Emergencies"}, {"id": "q_0084_1", "question": "Under what conditions should glucagon be administered to a hypoglycemic adult versus a hypoglycemic child?", "answer": "Glucagon should be given to an adult with a blood glucose level lower than 4 mmol/L or a child with a blood glucose level lower than 3 mmol/L, and only when the patient cannot protect their airway (making oral glucose inappropriate).", "category": "Diabetic & Metabolic Emergencies"}, {"id": "q_0084_2", "question": "Why is glucagon contraindicated in a patient with pheochromocytoma?", "answer": "Glucagon stimulates catecholamine release, and in the presence of a pheochromocytoma the tumor can release catecholamines in response, potentially causing a dangerous sudden and marked increase in blood pressure.", "category": "Diabetic & Metabolic Emergencies"}, {"id": "q_0084_3", "question": "What is an aura in the context of a generalized tonic-clonic seizure?", "answer": "An aura is an unusual sensation or feeling — such as a strange sound, taste, smell, or an urgent need to get to safety — that some patients experience before a generalized seizure occurs, potentially giving them time to sit or lie down and warn bystanders.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0085_1", "question": "What are the four stages of a generalized seizure in order?", "answer": "The four stages are: aura phase (unusual sensation, not always present), tonic phase (unresponsiveness and muscle rigidity), clonic phase (uncontrollable muscular contractions), and postictal phase (diminished responsiveness, confusion, and gradual recovery).", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0085_2", "question": "How do complex partial seizures differ from simple partial seizures?", "answer": "In simple partial seizures the patient usually remains aware of their surroundings, whereas in complex partial seizures awareness is either impaired or lost while the patient remains responsive.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0085_3", "question": "Which type of seizure is most common in patients with epilepsy?", "answer": "Partial seizures are the most common type of seizure experienced by patients with epilepsy.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0086_1", "question": "What distinguishes a complex partial seizure from a simple partial seizure in terms of patient awareness afterward?", "answer": "After a complex partial seizure, the patient generally cannot remember what happened and may be very confused, whereas in a simple partial seizure the patient may remember everything that occurred.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0086_2", "question": "Why is an absence (petit mal) seizure also called a non-convulsive seizure?", "answer": "It is called non-convulsive because the body remains relatively still during the episode, with little to no movement.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0086_3", "question": "What causes febrile seizures and which age group is most at risk?", "answer": "Febrile seizures are brought on by a rapid increase in body temperature and are most common in children under the age of 5 years.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0087_1", "question": "What rectal temperature threshold makes a febrile seizure most likely to occur in a child or infant?", "answer": "A rectal temperature of over 39°C (102°F) makes a febrile seizure most likely to occur.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0087_2", "question": "What defines status epilepticus?", "answer": "Status epilepticus is a seizure lasting longer than 5 minutes, or a series of repeated seizures lasting longer than 5 minutes without a return to normal responsiveness between them.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0087_3", "question": "What are the two main priorities when treating a patient who is having a seizure?", "answer": "The two main priorities are preventing injury and managing the airway.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0088_1", "question": "Why should you never place anything in the mouth of an actively seizing patient to prevent tongue biting?", "answer": "It is rare that an actively seizing patient bites hard enough to cause significant bleeding, and placing something in the mouth may obstruct the airway instead.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0088_2", "question": "What position should you place a seizing patient in to manage their airway, and why?", "answer": "Position the patient on their side if possible, so that fluids such as saliva, blood, and vomit can drain away from the mouth rather than cause obstruction.", "category": "Stroke & Neurological Emergencies"}, {"id": "q_0088_3", "question": "What factors determine the severity and presentation of poisoning in a patient?", "answer": "The type and amount of the substance, how it entered the body, and the patient's height, weight, and age all influence the severity and presentation of poisoning.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0089_1", "question": "What four questions should a first responder try to answer if poisoning is suspected?", "answer": "They should determine: (1) what type of poison it was, (2) how contamination occurred (route of entry), (3) when it occurred, and (4) what quantity of poison was involved.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0089_2", "question": "What scene clues might indicate that a patient has been poisoned?", "answer": "Clues include unusual odours, open or spilled containers, open medicine cabinets, overturned plants, flames or smoke, and drug paraphernalia such as syringes or pipes.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0089_3", "question": "What is one sign of inhaled poisoning that distinguishes it from general poisoning signs?", "answer": "A bluish colour (cyanosis) around the mouth is a sign specific to inhaled poisoning, along with an unusual smell in the air or on the patient's breath.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0090_1", "question": "Why is carbon monoxide (CO) a frequent cause of accidental poisoning deaths?", "answer": "CO is odourless, colourless, and tasteless, making it undetectable to the senses, and it is quite common in fumes produced by burning fuel in cars, stoves, furnaces, and other devices.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0090_2", "question": "How does carbon monoxide cause harm in the body?", "answer": "CO replaces the oxygen bonded to red blood cells, slowly depriving the body of oxygen, so most signs and symptoms of CO poisoning are essentially signs and symptoms of hypoxia, primarily affecting the central nervous system and the heart.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0090_3", "question": "Why should any patient with suspected inhaled poisoning be placed in the rapid transport category?", "answer": "Because respiration is often impaired with inhaled poisoning, making prompt transport essential for patients who may require interventions for respiratory distress or arrest.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0091_1", "question": "Why is carbon monoxide (CO) poisoning often mistaken for other conditions, and what specific scenario should raise suspicion for it?", "answer": "CO poisoning symptoms can be vague and non-specific; mild cases are often mistaken for food poisoning or gastroenteritis. Headaches and flu-like symptoms reported by multiple people in the same dwelling, especially during colder months when heating is active, should raise suspicion.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0091_2", "question": "What are the three basic categories used to classify commonly misused and abused substances?", "answer": "Stimulants, depressants, and hallucinogens — classified according to their effects on the central nervous system.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0091_3", "question": "Why are designer drugs considered potentially more dangerous than the drugs they are chemically derived from?", "answer": "When a drug's chemical makeup is altered, the user may experience unpredictable and dangerous effects; designer drugs may also be more potent than their parent drugs or have additional effects on the mind or body.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0092_1", "question": "Why is crack cocaine considered particularly dangerous compared to other forms of cocaine?", "answer": "Crack is highly addictive and, when inhaled through smoking, its vapors reach the brain within 10 seconds, making it a serious threat.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0092_2", "question": "What are the two most common legal stimulants, and where are they found?", "answer": "Caffeine, found in coffee, tea, sodas, chocolate, diet pills, and anti-fatigue pills, and nicotine, found in tobacco products.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0092_3", "question": "What cardiovascular and respiratory effects can result from misuse or abuse of stimulants?", "answer": "Stimulant misuse can cause tachycardia (rapid pulse), tachypnea (rapid breathing), high blood pressure, chest pain, disrupted heart rhythms, and respiratory emergencies.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0093_1", "question": "What are the common types of depressants?", "answer": "Common depressants include alcohol, barbiturates, benzodiazepines, narcotics, and inhalants.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0093_2", "question": "What are the dangers of chronic alcohol consumption on the brain and body?", "answer": "Chronic drinking can cause lack of coordination, memory loss, and apathy, as well as liver diseases such as cirrhosis.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0093_3", "question": "Why are narcotics considered a regulated class of depressants?", "answer": "All narcotics are illegal without a prescription, and some are not medically prescribed at all, because they are powerful substances used to relieve anxiety and pain.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0094_1", "question": "Why do opioids pose a high risk of fatal overdose compared to other depressants?", "answer": "In higher quantities, opioids bind to receptors in the brain that control respiration, rapidly causing respiratory arrest.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0094_2", "question": "What is naloxone and how does it counteract an opioid overdose?", "answer": "Naloxone is a drug that binds to the same brain receptors as opioids, displacing the opioid and preventing respiratory arrest. It can be given intranasally, intramuscularly, or subcutaneously.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0094_3", "question": "What respiratory finding is a key sign of opioid overdose?", "answer": "Slow or absent respiration, defined as fewer than 8 breaths per minute, possibly accompanied by gurgling or snoring sounds.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0095_1", "question": "What are the most widely abused hallucinogens in emergency medical contexts?", "answer": "The most widely abused hallucinogens are LSD (acid), psilocybin (mushrooms), and PCP (angel dust). These are usually ingested, though PCP is also often inhaled.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0095_2", "question": "What signs and symptoms may indicate hallucinogen use in a patient?", "answer": "Signs include sudden mood changes, a flushed face, reporting seeing or hearing things that are not present, anxiety, and fear. Hallucinogens can also cause intense paranoid delusions, vivid hallucinations, profound depression, and irrational behavior.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0095_3", "question": "Does treating a patient for substance misuse require knowing the specific substance taken?", "answer": "No. Initial intervention for substance misuse or abuse does not require knowing the specific substance, as treatment follows the same general steps as for other types of poisoning.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0096_1", "question": "Why is it important to inform receiving medical staff when a patient may have overdosed on a designer drug?", "answer": "A patient who has overdosed on a designer drug may not respond to traditional medical treatment, so this information must be included in the patient history during care transfer.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0096_2", "question": "What must be done to a vehicle before any attempt is made to access its occupants at an emergency scene?", "answer": "The vehicle must be stabilized to ensure it does not slide, shift, or roll in a way that could injure responders or patients.", "category": "Rescue & Extrication"}, {"id": "q_0096_3", "question": "What environmental factors can affect the stability of a vehicle at an emergency scene?", "answer": "Ice, water, snow, and inclined surfaces or embankments can all influence how difficult or technical the stabilization task will be.", "category": "Rescue & Extrication"}, {"id": "q_0097_1", "question": "What is the purpose of chocking a vehicle at a motor vehicle collision scene?", "answer": "Chocking involves placing blocks or wedges against a vehicle's wheels to reduce the chance of it rolling backwards or forwards.", "category": "Rescue & Extrication"}, {"id": "q_0097_2", "question": "How should a vehicle with a manual transmission be secured during extrication compared to one with an automatic transmission?", "answer": "A manual transmission vehicle should be placed in neutral gear with the emergency brake on, rather than in park, while an automatic transmission vehicle is placed in park.", "category": "Rescue & Extrication"}, {"id": "q_0097_3", "question": "Why must extra caution be used around vehicles equipped with proximity keys during extrication?", "answer": "The ignition in proximity-key vehicles can be activated by pressing a button inside the vehicle as long as the keys are within a certain range, creating a risk of unintended engine start.", "category": "Rescue & Extrication"}, {"id": "q_0098_1", "question": "Which muscle groups should be used when lifting a heavy patient, and which should be avoided?", "answer": "Use the muscles of the legs, hips, buttocks, and abdomen to lift. Never use the back muscles to move or lift a heavy object.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0098_2", "question": "How far in front of you should you avoid reaching when moving a patient, and why?", "answer": "Avoid reaching more than 15 to 20 cm (6 to 8 in.) in front of you, because the upper back and shoulder muscles fatigue quickly in that stretched position and the risk of injury increases.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0098_3", "question": "Why is it important for an EMR to avoid personal injury during a patient extrication?", "answer": "If the EMR becomes injured, they may be unable to move the patient and will themselves require treatment, adding another patient to the scene and complicating the situation for other responders.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0099_1", "question": "When performing a walking assist on an injured patient, which side of the patient should the responder position themselves on?", "answer": "The responder should position themselves on the patient's injured or weaker side, placing the patient's arm across their shoulders and supporting the patient's waist with the other hand.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0099_2", "question": "Which emergency patient moves can be performed by one or two people without any equipment?", "answer": "The walking assist, two-person seat carry, clothes drag, blanket drag, and extremity lift can all be performed by one or two people without equipment.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0099_3", "question": "What criterion determines whether an emergency patient move is considered successful?", "answer": "A move is successful as long as the patient is moved to safety without injuring the responder or the patient.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0100_1", "question": "Why is the clothes drag the preferred emergency move for a patient suspected of having a head or spinal injury?", "answer": "Because it helps maintain basic manual spinal motion restriction (SMR) during the move, keeping the patient's head, neck, and back as straight as possible.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0100_2", "question": "On what type of surface does the blanket drag work best?", "answer": "The blanket drag works best on a smooth surface.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0100_3", "question": "How is the patient supported during a two-person seat carry?", "answer": "The two responders interlock their arms under the patient's thighs and across the patient's back, forming a seat with their joined arms in which the patient is lifted.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0101_1", "question": "Under what patient conditions is the extremity lift considered inappropriate?", "answer": "The extremity lift is not appropriate when the patient has a suspected head or spinal injury, or injuries to the pelvis, arms, or legs.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0101_2", "question": "What are the visual signs that indicate a stretcher or lifting device may be damaged and unsafe?", "answer": "Signs of damage include rust, cracks, severe discoloration, and bent frames; plastic stretchers can also be damaged by prolonged sunlight exposure or contact with corrosive material.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0101_3", "question": "In what position must a patient be placed before performing an extremity lift?", "answer": "The patient must first be carefully moved into a seated position before the lift is executed.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0102_1", "question": "What is the primary advantage of using a scoop stretcher for a patient with a suspected spinal injury?", "answer": "A scoop stretcher separates into two pieces that can be placed on either side of the patient and reconnected underneath, allowing the patient to be lifted without rolling them.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0102_2", "question": "What is the backboard primarily used for in emergency medical response?", "answer": "The backboard is used primarily for extrication purposes; it is a long, rigid board with side slots for straps to secure the patient.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0102_3", "question": "What feature of the basket stretcher makes it suitable for low- or high-angle rescues?", "answer": "The basket stretcher has slightly raised sides and allows a patient to be secured to it, making it safe to carry over long distances or to lower and raise the patient off the ground.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0103_1", "question": "What is the primary advantage of a flexible litter over a basket stretcher when moving patients through confined spaces?", "answer": "A flexible litter has no rigid structure and wraps around the patient, making it little more than the circumference of the patient's body, so it works well in narrow passageways and accommodates patients of various sizes, including those for whom a basket stretcher may be restrictive.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0103_2", "question": "When is a stair chair used instead of a multi-level stretcher?", "answer": "A stair chair is used to extricate a patient from a location not accessible to a multi-level stretcher, such as a small elevator or staircase where a longer stretcher will not fit; the patient is typically transferred to a multi-level stretcher once a suitable location is reached.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0103_3", "question": "Why should the safety rails on a multi-level stretcher not be used for lifting?", "answer": "The safety rails on each side of the stretcher are not designed to bear the load of lifting; the stretcher should be lifted using other designated points, not these rails.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0104_1", "question": "What precaution must a responder take when preparing a helicopter stretcher for use?", "answer": "The responder must ensure the stretcher is open with the correct surface up so that it will not accidentally fold in half during use.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0104_2", "question": "What should be done to an army-type stretcher before it is used with a patient?", "answer": "The stretcher should be tested before being used with a patient to verify its condition and that the spreader bars are locked into place.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0104_3", "question": "Why is completing an ambulance equipment and supply checklist at the beginning of every work shift important?", "answer": "It is important for safety, patient care, and risk management, ensuring the vehicle is functioning properly, all supplies are fully stocked, and equipment requiring routine maintenance is ready for use.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0105_1", "question": "What categories of checks are included in a daily ambulance vehicle safety pre-trip inspection?", "answer": "The pre-trip inspection covers under-hood items (fluids, belts, battery), exterior items (lights, tires, body damage), interior items (brakes, gauges, seatbelts), emergency equipment (warning lights, siren, fire extinguisher), and documentation (ownership, insurance, inspection certificate).", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0105_2", "question": "Why must all vehicle check deficiencies be documented and reported?", "answer": "Problems or deficiencies must be brought to the attention of the responsible individual, and organizations must have clear procedures for reporting vehicle problems to ensure safety issues are addressed.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0105_3", "question": "What personal protective items must be carried on an ambulance as part of emergency equipment?", "answer": "The vehicle must carry 2 helmets, 2 traffic safety vests, and 2 level C hazmat suits.", "category": "Patient Handling & Transport Equipment"}, {"id": "q_0106_1", "question": "What is the term 'triage' derived from, and what does the process involve?", "answer": "Triage is a French term first used to refer to the sorting and treatment of those injured in battle; today it is a system for sorting patients into categories according to the severity of their injuries or illnesses when there are more patients than responders.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0106_2", "question": "Why is a standard full primary and secondary patient assessment inadequate in a mass casualty incident (MCI)?", "answer": "Because conducting a full assessment on each patient could consume all of a responder's time with a single patient, causing other critically injured patients — such as someone who is unresponsive and not breathing — to be overlooked and die.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0106_3", "question": "What mindset shift does triage in an MCI require from responders regarding some patients?", "answer": "Responders must accept death and dying, recognizing that some patients who would normally receive high-priority care such as CPR may be beyond their ability to help given limited resources.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0107_1", "question": "What three factors does the START triage system require responders to assess?", "answer": "Respiration, circulation, and level of responsiveness.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0107_2", "question": "What are the four patient classification levels in the START triage system?", "answer": "Minor, immediate, delayed, and dead/non-salvageable.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0107_3", "question": "In the START system, what defines a 'walking wounded' patient and how are they managed?", "answer": "A walking wounded patient can walk from the incident site without assistance and falls in the minor category; they are directed to a designated area for evaluation by arriving medical personnel.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0108_1", "question": "What triage color code is assigned to patients who are dead or non-salvageable?", "answer": "Black or grey markers are assigned to dead/non-salvageable patients.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0108_2", "question": "Under the START triage system, how is a patient classified if they begin breathing only after the rescuer opens their airway?", "answer": "A patient who breathes only after airway opening is classified as immediate care (red tag), because they require help maintaining an open airway and are high priority.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0108_3", "question": "What criteria classify a patient as dead/non-salvageable during mass casualty triage?", "answer": "A patient is classified dead/non-salvageable if they are not breathing after attempts to open and clear the airway, or if they have an obvious mortal injury such as decapitation.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0109_1", "question": "In the START triage system, what respiration rate threshold determines whether a patient is classified as immediate?", "answer": "A respiration rate of more than 30 breaths per minute classifies a patient as immediate.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0109_2", "question": "In the START triage system, what does the absence of a radial pulse indicate and how should the patient be categorized?", "answer": "Absence of a radial pulse indicates the patient's blood pressure is very low; the EMR should control external hemorrhaging and classify the patient as immediate.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0109_3", "question": "In the START triage system, how is a patient's level of responsiveness used to distinguish between the delayed and immediate categories?", "answer": "A patient who is alert and responds appropriately to verbal stimuli is classified as delayed; one who is unresponsive, responds only to painful stimuli, or responds inappropriately to verbal stimuli is classified as immediate.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0110_1", "question": "What does the acronym CBRNE stand for, and how is it used in Canada?", "answer": "CBRNE stands for Chemical, Biological, Radiological, Nuclear, Explosive. It is the general term used in Canada to refer to weapons of mass destruction (WMDs).", "category": "Triage & Mass Casualty Response"}, {"id": "q_0110_2", "question": "What are the four categories of dissemination methods used in CBRNE events?", "answer": "The four categories are mechanical action, chemical reaction, pneumatic devices, and explosive devices.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0111_1", "question": "Under what condition should a first responder attempt assessment and care of a patient in a CBRNE incident without specialized PPE?", "answer": "Assessment and care without appropriate PPE should only be attempted once the patient has been decontaminated.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0111_2", "question": "What spacing should contaminated casualties with minor injuries maintain between themselves and others at a gathering point?", "answer": "Casualties should keep a distance of approximately 5 metres (16 feet) between themselves and others to reduce the risk of contamination.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0111_3", "question": "How can explosive devices function in a CBRNE context beyond causing blast injuries and property damage?", "answer": "Explosive devices can also be used as dispersal devices to spread other harmful agents.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0112_1", "question": "What is 'directed first aid' in the context of emergency response?", "answer": "Directed first aid is care a patient provides to themselves (or another patient nearby) while being instructed by a more qualified person, used when responders cannot safely reach or touch the patient.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0112_2", "question": "Why must a patient contaminated in a CBRNE event be decontaminated before leaving the scene?", "answer": "To prevent further harm to the patient and to reduce the risk of contaminating others.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0112_3", "question": "What does Emergency Wash-Down (EW) consist of, and is it a substitute for formal decontamination?", "answer": "EW involves carefully removing all clothing and washing skin thoroughly with soap and water; it is not a substitute for formal decontamination, which should still be performed once proper facilities are available.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0113_1", "question": "What is the recommended wash sequence for patients undergoing field decontamination with a fire hose fog nozzle?", "answer": "Patients should walk through the water spray with head back and arms and legs spread, then wash from the top down using soap if available, while avoiding swallowing water or touching their faces with contaminated hands.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0113_2", "question": "What transportation alternatives may be used during a large-scale CBRNE event when ambulances are insufficient?", "answer": "Public transit buses or school buses may be used to transport patients with minor injuries, reserving ambulances for patients with more urgent complaints.", "category": "Triage & Mass Casualty Response"}, {"id": "q_0114_1", "question": "What is the difference between 'assisting with medication' and 'administering medication' in a first aid context?", "answer": "Administering medication means making the decision to give a medication and physically introducing the drug into the patient's body, while assisting with medication means following a patient's specific direction to help them with their medication without crossing into administration.", "category": "Pharmacology & Medication Administration"}, {"id": "q_0114_2", "question": "Which activities are considered 'assisting' rather than 'administering' medication?", "answer": "Assisting includes actions such as opening a pill bottle, placing pills in a patient's hand, opening an epinephrine auto-injector, unwrapping a transdermal patch, reading a medication's label aloud, and pushing pills out of a blister pack.", "category": "Pharmacology & Medication Administration"}, {"id": "q_0114_3", "question": "Who is legally permitted to administer medication in a workplace setting?", "answer": "Only very specific groups of medical professionals are legally allowed to administer medication; first aid attendants may assist with medication but must know their provincial or territorial regulations regarding that role.", "category": "Pharmacology & Medication Administration"}, {"id": "q_0115_1", "question": "What are the Six Rights of Medication that a responder must verify before administering or assisting a patient with any medication?", "answer": "The Six Rights are: Right person, Right medication, Right dosage, Right time, Right route, and Right documentation.", "category": "Pharmacology & Medication Administration"}, {"id": "q_0115_2", "question": "What four elements must be included when documenting medication administration under the Right Documentation requirement?", "answer": "The responder must document the time, dose, route, and effect of the medication administered.", "category": "Pharmacology & Medication Administration"}, {"id": "q_0115_3", "question": "How are drug administration routes broadly categorized in pharmacology?", "answer": "Routes are categorized as enteral (through the digestive system) or parenteral (not through the digestive system).", "category": "Pharmacology & Medication Administration"}, {"id": "q_0116_1", "question": "Why does the sublingual route of drug administration produce rapid absorption?", "answer": "Sublingual medications are placed under the tongue and absorbed directly into the bloodstream through the mucous membranes, bypassing the digestive system.", "category": "Pharmacology & Medication Administration"}, {"id": "q_0116_2", "question": "How does subcutaneous drug administration compare to intramuscular administration in terms of volume and onset?", "answer": "Subcutaneous administration involves smaller volumes and has a slower onset than intramuscular administration.", "category": "Pharmacology & Medication Administration"}, {"id": "q_0116_3", "question": "What restriction applies to the endotracheal route of drug administration in a pre-hospital setting?", "answer": "The endotracheal route is restricted to advanced life support (ALS) practitioners.", "category": "Pharmacology & Medication Administration"}, {"id": "q_0117_1", "question": "What are the four processes that pharmacokinetics encompasses in studying how the body handles a drug?", "answer": "Pharmacokinetics encompasses drug absorption, drug distribution, biotransformation, and excretion.", "category": "Pharmacology & Medication Administration"}, {"id": "q_0117_2", "question": "What effect does stimulation of Beta2 receptors by epinephrine produce?", "answer": "Stimulation of Beta2 receptors causes bronchodilation.", "category": "Pharmacology & Medication Administration"}, {"id": "q_0117_3", "question": "What happens when parasympathetic (cholinergic) receptors are stimulated?", "answer": "Stimulation of cholinergic receptors causes bronchodilation and a decreased heart rate.", "category": "Pharmacology & Medication Administration"}, {"id": "q_0118_1", "question": "What are the three factors used to calculate IV flow rate in drops per minute?", "answer": "The three factors are: volume to be infused, the gtt/mL of the administration set (the drop size of the drip set), and the total time of infusion in minutes.", "category": "IV Therapy & Injections"}, {"id": "q_0118_2", "question": "What is the difference between a micro-drip and a macro-drip administration set?", "answer": "A micro-drip set produces drops of 60 gtt/mL, while a macro-drip set produces larger drops at 20, 15, or 10 gtt/mL.", "category": "IV Therapy & Injections"}, {"id": "q_0118_3", "question": "What does the abbreviation 'gtt' stand for and what does it represent in IV therapy?", "answer": "Gtt stands for the Latin word guttae, meaning drops; it is used to express IV flow rates in drops per minute (gtt/min).", "category": "IV Therapy & Injections"}, {"id": "q_0119_1", "question": "What does it mean when an IV is described as interstitial, and how is it identified?", "answer": "An interstitial IV means the fluid is flowing into surrounding tissues instead of the vein due to complete or partial perforation of the opposite vein wall. It is identified by swelling around the injection site, cool skin at the site, possible diminished flow rate, and pain may or may not be present.", "category": "IV Therapy & Injections"}, {"id": "q_0119_2", "question": "What is the first intervention when a patient shows signs of circulatory overload from IV fluid administration?", "answer": "Immediately slow the IV rate to keep the vein open (TKVO).", "category": "IV Therapy & Injections"}, {"id": "q_0119_3", "question": "What causes circulatory overload in a patient receiving IV fluids, and what complications can result?", "answer": "Circulatory overload is caused by excessive fluid administration or rapid fluid delivery when the patient's system cannot manage the extra fluids. It leads to cardiac and pulmonary complications similar to congestive heart failure or pulmonary edema.", "category": "IV Therapy & Injections"}, {"id": "q_0120_1", "question": "What is the difference between thrombosis and thrombophlebitis as IV complications?", "answer": "Thrombosis is the formation of a clot, usually at the tip of the catheter, while thrombophlebitis is inflammation of a vein caused by the formation of a blood clot.", "category": "IV Therapy & Injections"}, {"id": "q_0120_2", "question": "What are the correct steps to manage thrombophlebitis at an IV site?", "answer": "Discontinue the IV, record the time and amount of fluid infused, and apply warm wet compresses to reduce pain and promote healing — do not massage or rub the affected arm as this may dislodge the clot.", "category": "IV Therapy & Injections"}, {"id": "q_0120_3", "question": "What should you do with the catheter if a catheter embolism is suspected?", "answer": "Do not discard the catheter; give it to hospital personnel for examination and follow-up.", "category": "IV Therapy & Injections"}, {"id": "q_0121_1", "question": "What are the signs of an IV site infection that an EMT should recognize?", "answer": "Redness around the catheter, swelling of the site, and possible discharge indicate an IV site infection.", "category": "IV Therapy & Injections"}, {"id": "q_0121_2", "question": "What is the most common cause of IV site infections?", "answer": "Most infections result from skin flora entering the wound due to non-aseptic techniques during IV initiation.", "category": "IV Therapy & Injections"}, {"id": "q_0121_3", "question": "What can cause an air embolism during IV therapy, and how is it prevented?", "answer": "Air embolisms can result from allowing an IV bag to run dry, attaching uncleared tubing, or loose connections. Prevention includes thoroughly clearing all tubing of air bubbles, changing bags before they empty, and securing all connections.", "category": "IV Therapy & Injections"}, {"id": "q_0122_1", "question": "What position should a patient be placed in if an air embolism has occurred during IV therapy?", "answer": "Turn the patient on their left side with the head angled 30 degrees lower than the rest of the body. This keeps air bubbles on the right side of the heart, where they can enter the pulmonary circulation and be absorbed.", "category": "IV Therapy & Injections"}, {"id": "q_0122_2", "question": "At what angle should the needle be inserted when performing an intradermal injection?", "answer": "The needle should be inserted almost parallel to the arm, at an approximately 5- to 7-degree angle, with the bevel of the needle facing away from the skin.", "category": "IV Therapy & Injections"}, {"id": "q_0122_3", "question": "What needle gauge is used to draw medication into the syringe before an intradermal injection, and what gauge is used for the actual injection?", "answer": "A 19- or 21-gauge needle is used to draw the medication, then it is replaced with a 25- or 27-gauge needle (1 to 1.6 cm long) for the actual intradermal injection.", "category": "IV Therapy & Injections"}, {"id": "q_0123_1", "question": "What is the difference between disinfection and sterilization of surgical instruments?", "answer": "Disinfection inactivates infectious agents and reduces the number of bacteria and viruses on an object, but does not fully sterilize it; sterilization (e.g., via autoclave) is a further step.", "category": "Infection Control & Transmission"}, {"id": "q_0123_2", "question": "How long should instruments be soaked in a disinfectant solution before cleaning?", "answer": "All instruments should be soaked in a disinfectant solution for 30 minutes before cleaning.", "category": "Infection Control & Transmission"}, {"id": "q_0123_3", "question": "What is the required wash temperature and duration for disinfecting soiled linen after an initial cool-water wash and chlorine treatment?", "answer": "Soiled linen should be washed with detergent at a temperature of at least 71°C (160°F) for 25 minutes.", "category": "Infection Control & Transmission"}, {"id": "q_0124_1", "question": "What is 'contact time' in the context of disinfection?", "answer": "Contact time is the duration that an infectious material must remain in contact with a disinfectant solution in order for the infectious material to become completely inactivated.", "category": "Infection Control & Transmission"}, {"id": "q_0124_3", "question": "What are the three most common methods of sterilizing surgical equipment?", "answer": "The three most common methods are steam sterilization (autoclaving), dry heat, and chemical antiseptics.", "category": "Infection Control & Transmission"}, {"id": "q_0125_1", "question": "What are the three approaches WHMIS uses to help identify and handle hazardous materials safely?", "answer": "WHMIS uses labels, Safety Data Sheets (SDSs), and worker education to identify and handle hazardous materials safely.", "category": "Workplace Health & Safety"}, {"id": "q_0125_2", "question": "What is the most common method of poisoning in the shipping industry?", "answer": "Inhalation is the most common method of poisoning in the shipping industry, and a toxic substance may be in the form of vapour, gas, mist, spray, dust, or fumes.", "category": "Marine & Environmental Emergency Care"}, {"id": "q_0125_3", "question": "Where should copies of relevant Safety Data Sheets (SDSs) be kept on a work site?", "answer": "SDSs must be kept where the first aid attendant has ready access to them and also at all locations where the hazardous products are used.", "category": "Workplace Health & Safety"}, {"id": "q_0126_1", "question": "What signs and symptoms can indicate seasickness?", "answer": "Seasickness can present with loss of appetite, nausea, headaches, cold sweat, dizziness, abdominal cramps, vomiting, exhaustion, or dry mouth.", "category": "Marine & Environmental Emergency Care"}, {"id": "q_0126_2", "question": "What is the recommended approach for cleaning oil contamination off a shipwreck survivor's skin?", "answer": "Clean the skin only after the patient is warm and comfortable, with the exception of areas around the mouth and eyes, which should be cleaned immediately; wipe the skin with a soft cloth or strong paper towels.", "category": "Marine & Environmental Emergency Care"}, {"id": "q_0126_3", "question": "Under ideal conditions, how long might a healthy, uninjured person survive at sea in a rescue craft?", "answer": "At least 3 days, and potentially as long as a month depending on available resources.", "category": "Marine & Environmental Emergency Care"}, {"id": "q_0127_1", "question": "What conditions cause immersion foot (trench foot)?", "answer": "Immersion foot is caused by exposure of the lower extremities to water above freezing but usually below 10°C (50°F) for more than 12 hours, often combined with wet and constrictive clothing and a poor diet.", "category": "Marine & Environmental Emergency Care"}, {"id": "q_0127_2", "question": "What are the initial signs and symptoms of immersion foot before the foot warms up?", "answer": "Initial signs include swollen, cold, waxy feet; peeling skin; reduced sensitivity to touch; a wooden feeling in the feet; and delayed capillary refill time (nail beds stay white after being squeezed).", "category": "Marine & Environmental Emergency Care"}, {"id": "q_0127_3", "question": "How should food and water be administered to survivors who have been adrift and are suffering from dehydration or malnutrition?", "answer": "Food and water should be given in small amounts at first, starting with nourishing liquids such as a sugar-and-water combination, milk, or soup, continuing until the survivor can be transferred to medical care ashore.", "category": "Marine & Environmental Emergency Care"}, {"id": "q_0128_1", "question": "What label must be placed on ship medications that cannot be administered without physician authorization?", "answer": "They must be labelled 'Give only on radio medical advice from a physician.'", "category": "Marine & Environmental Emergency Care"}, {"id": "q_0128_2", "question": "How often should the contents of a ship's medicine chest be inspected, and by whom?", "answer": "The ship's medicine chest should be inspected annually by a pharmacist.", "category": "Marine & Environmental Emergency Care"}, {"id": "q_0128_3", "question": "Why is it important to question a patient about allergies, medical conditions, and current medications during the first assessment on a ship?", "answer": "It allows you to identify helpful existing medications and discover any contraindications or factors that may change the medication choice or how it is used.", "category": "Marine & Environmental Emergency Care"}, {"id": "q_0129_1", "question": "Under what condition is nitroglycerin spray permitted to be administered in the DFO/5758 framework?", "answer": "Nitroglycerin spray may only be administered on the advice of a doctor, making it a medication restricted to radio medical advice.", "category": "Marine & Environmental Emergency Care"}, {"id": "q_0129_2", "question": "What are the three essential characteristics of each medication that a first aid attendant must know before administering or assisting with a drug?", "answer": "The three essential characteristics are indications (uses), side effects, and contraindications (precautions).", "category": "Pharmacology & Medication Administration"}, {"id": "q_0129_3", "question": "In a marine environment, what format does the International Medical Guide for Ships (3rd Edition, 2007) use to present information about each medicine?", "answer": "It presents each medicine with four elements: dosage, indications, contraindications, and side effects.", "category": "Marine & Environmental Emergency Care"}, {"id": "q_0130_1", "question": "What authority does the advanced first aid attendant have regarding a worker's medical care?", "answer": "The attendant has the authority to send a worker for medical care if necessary, and the patient remains the attendant's responsibility until care is transferred to qualified pre-hospital emergency medical personnel or hospital staff.", "category": "Workplace Health & Safety"}, {"id": "q_0130_2", "question": "When must the advanced first aid attendant conduct follow-up with an ill or injured worker after an incident?", "answer": "The attendant must conduct follow-up approximately three days after the person returns to work.", "category": "Workplace Health & Safety"}, {"id": "q_0130_3", "question": "What qualifications must a workplace first aid attendant hold?", "answer": "The attendant must be an employee with a current, recognized first aid certificate from a recognized training agency, certified at the level required by law for that particular workplace.", "category": "Workplace Health & Safety"}, {"id": "q_0131_1", "question": "What CSA standard should workplace first aiders reference when determining the first aid kits and equipment required for their worksites?", "answer": "Workplace first aiders should reference CSA Z1220-17, the CSA standard for first aid kits.", "category": "Workplace Health & Safety"}, {"id": "q_0131_2", "question": "What does the Canadian Centre for Occupational Health and Safety (CCOHS) state about the working environment rights of Canadians?", "answer": "The CCOHS states that all Canadians have a fundamental right to a healthy and safe working environment.", "category": "Workplace Health & Safety"}, {"id": "q_0131_3", "question": "What must workplace occupational health and safety programs include regarding AEDs?", "answer": "They must include written policies and procedures regarding AEDs, covering AED access, training, and operation and maintenance.", "category": "Workplace Health & Safety"}, {"id": "q_0132_2", "question": "What is the minimum level of training a responder should have when dealing with a hazardous material situation such as a chemical spill?", "answer": "At a minimum, responders should have awareness-level training dealing with haz-mat response.", "category": "Workplace Health & Safety"}, {"id": "q_0132_3", "question": "What resource helps emergency responders quickly identify hazardous materials involved in a transportation incident?", "answer": "Transport Canada's 2016 Emergency Response Guidebook helps responders identify hazardous materials and protect themselves and the public during the initial response phase.", "category": "Workplace Health & Safety"}, {"id": "q_0133_1", "question": "According to WHMIS regulations, what four obligations do employers have regarding hazardous materials in the workplace?", "answer": "Employers must clearly label hazardous materials, inform employees about risks and precautions, maintain a detailed SDS for every hazardous substance, and provide proper training in safety measures and emergency procedures to workers who may be exposed.", "category": "Workplace Health & Safety"}, {"id": "q_0133_2", "question": "Which body parts are most commonly involved in workplace injuries, and why?", "answer": "The hands and arms are most commonly involved because they can get caught in machinery.", "category": "Workplace Health & Safety"}, {"id": "q_0133_3", "question": "What rule should employees follow regarding containers of unknown substances in the workplace?", "answer": "Employees should never use a product that is in an unidentified container.", "category": "Workplace Health & Safety"}, {"id": "q_0134_1", "question": "What is the purpose of lock-out/tag-out procedures in agricultural or industrial settings?", "answer": "Lock-out/tag-out procedures safeguard against the unexpected startup of machinery or the release of hazardous energy during maintenance by disconnecting equipment from its energy source and locking or tagging the energy-isolating device.", "category": "Workplace Health & Safety"}, {"id": "q_0134_2", "question": "What must be confirmed before anyone enters a confined space during an emergency rescue?", "answer": "A person qualified to enter confined spaces must ensure structures are safe from collapse, and there must be a first aid attendant directly outside, a plan for emergency rescue, and a safe communication method between the responder inside and the attendant outside.", "category": "Rescue & Extrication"}, {"id": "q_0134_3", "question": "What types of hazards should a responder look for before entering an agricultural storage area or similar facility?", "answer": "Responders should check for toxic chemicals, fires or fire hazards, unstable structures, running machinery, and unsecured livestock or animals before entering.", "category": "Workplace Health & Safety"}, {"id": "q_0135_1", "question": "Why should you not rely on your senses to determine whether air in a confined space is safe?", "answer": "Many toxic gases and vapours are invisible and odourless, and a low-oxygen environment will not be visually obvious, making sensory detection unreliable.", "category": "Workplace Health & Safety"}, {"id": "q_0135_2", "question": "When should traffic control personnel (TCP) be used at roadside construction sites?", "answer": "TCP should be used where signs, traffic control devices, and other procedures cannot provide effective traffic control, or when emergency or rapid work makes those measures impractical.", "category": "Workplace Health & Safety"}, {"id": "q_0135_3", "question": "What must be done to utilities before workers enter a confined space?", "answer": "Properly trained workers must control all utilities prior to entry, including electrical services, gas, propane, water, sanitary systems, communications, and any secondary service systems.", "category": "Workplace Health & Safety"}, {"id": "q_0136_1", "question": "What safe position should a Traffic Control Person (TCP) stand in while directing traffic?", "answer": "A TCP should stand on the side of the shoulder of the road, out of the way of moving vehicles, where they are clearly visible and have an unobstructed view of approaching traffic.", "category": "Workplace Health & Safety"}, {"id": "q_0136_2", "question": "Why must first aid attendants working in remote locations be prepared to provide extended care?", "answer": "Because emergency transportation may be delayed due to weather or other factors, requiring attendants to provide care until the ill or injured person can be handed over to personnel with more advanced qualifications.", "category": "Workplace Health & Safety"}, {"id": "q_0136_3", "question": "Which environmental and natural hazards should workers consider when assessing risk in remote locations?", "answer": "Workers should consider rising water or flooding, forest fires, avalanches and rockslides, unsafe drinking water, animal encounters, extreme temperatures, and falling dead trees or branches.", "category": "Workplace Health & Safety"}, {"id": "q_0137_1", "question": "What visual and sensory clues indicate the presence of hazardous materials at an emergency scene?", "answer": "Clues include placards on vehicles or storage facilities, spilled liquids or solids, unusual odours, clouds of vapour, and leaking containers.", "category": "Workplace Health & Safety"}, {"id": "q_0137_2", "question": "What positioning should a first responder take relative to a hazardous materials area while awaiting specialized assistance?", "answer": "The responder should stay upwind and uphill from the hazardous area and remain alert for wind changes that could blow vapours in their direction.", "category": "Workplace Health & Safety"}, {"id": "q_0137_3", "question": "Under what legal requirement are placards displayed on vehicles carrying hazardous materials?", "answer": "Placards are required by law to be placed on any vehicles that contain specific quantities of hazardous materials, and manufacturers and distributors of these materials are also required by law to display the appropriate placard.", "category": "Workplace Health & Safety"}, {"id": "q_0138_1", "question": "When calling for help at a scene with a suspected flammable hazardous material like natural gas, where should you use a telephone or radio?", "answer": "You should use a telephone or radio located a safe distance away from the scene, because even turning on a light switch or using a radio nearby may create a spark that sets off an explosion.", "category": "Workplace Health & Safety"}, {"id": "q_0138_2", "question": "What steps should be taken before transporting a person who has been exposed to pesticides or other toxic chemicals?", "answer": "Remove all clothing from the person and flush the body with water before transporting them.", "category": "Workplace Health & Safety"}, {"id": "q_0138_3", "question": "What factor most determines how quickly poisoning occurs when a person is exposed to a toxic industrial chemical?", "answer": "The route through which the chemical entered the body is the main factor; poisoning generally occurs more quickly if the chemical is inhaled.", "category": "Poisoning & Substance Misuse"}, {"id": "q_0139_1", "question": "What should employers include in health and safety plans to protect workers from toxic industrial chemical releases?", "answer": "Plans should include guidelines such as monitoring, detection, awareness training, PPE, decontamination, and medical surveillance of acutely exposed workers.", "category": "Workplace Health & Safety"}, {"id": "q_0139_2", "question": "Why is it recommended that chainsaw operators hold an emergency first aid certificate?", "answer": "Because people who work with chainsaws must understand how to control hemorrhages and deal with crush injuries.", "category": "Workplace Health & Safety"}, {"id": "q_0139_3", "question": "What first aid supplies should chainsaw operators always carry with them?", "answer": "Operators should always carry a first aid kit that includes a large-wound dressing, and they should have reasonable access to a more comprehensive kit.", "category": "Workplace Health & Safety"}, {"id": "q_0140_1", "question": "What method can be used to shut down a diesel engine that cannot be turned off normally when a person is in a life-threatening situation?", "answer": "A 9-kilogram (20-pound) CO2 fire extinguisher can be emptied into the air intake to shut down the engine, though this will cause considerable damage to the engine.", "category": "Rescue & Extrication"}, {"id": "q_0140_2", "question": "What are two ways a diesel-powered industrial machine can be shut down at the engine level?", "answer": "A diesel engine can be shut down using an air shut-off lever (instead of an ignition key) or by closing the shut-off valve at the bottom of the fuel tank (or using vice-grip pliers on the fuel line).", "category": "Rescue & Extrication"}, {"id": "q_0140_3", "question": "What health risks do chainsaws pose to operators, and how can these risks be controlled?", "answer": "Chainsaws pose risks of high noise and hand-arm vibration. These can be controlled by using low-noise/low-vibration models, providing hearing protection, maintaining equipment regularly, and training operators on the associated health risks.", "category": "Workplace Health & Safety"}, {"id": "q_0141_1", "question": "What are the two main methods for freeing a person trapped under an overturned tractor?", "answer": "Digging a trench underneath the person's body or cutting off a piece of the machine such as the steering wheel; in some cases a specialized team may be needed to lift the tractor off.", "category": "Rescue & Extrication"}, {"id": "q_0141_2", "question": "What is a Power Take-Off (PTO) and what common injury does it cause?", "answer": "A PTO is a device that transfers power from a tractor engine to an attached piece of equipment via a rotating shaft; clothing can snag on the shaft, frequently causing amputations that are often fatal.", "category": "Workplace Health & Safety"}, {"id": "q_0141_3", "question": "What precaution must be taken before attempting to extricate a patient trapped by a tractor rollover?", "answer": "The tractor must be fully stabilized before any extrication attempt is made.", "category": "Rescue & Extrication"}, {"id": "q_0142_1", "question": "Why should a combine's reverse feature never be used to free a patient entrapped in the machine?", "answer": "Reversing the combine can cause further injury; the safest approach is to prevent all machinery movement by jamming moving parts with pry bars and other tools before extrication begins.", "category": "Rescue & Extrication"}, {"id": "q_0142_2", "question": "What hazard does a PTO shaft pose when it is attached to a moving tractor but not connected to an accessory?", "answer": "The freely rotating shaft can catch onto clothing, limbs, or hair, causing serious injury or death.", "category": "Workplace Health & Safety"}, {"id": "q_0142_3", "question": "What precaution must be taken before using an acetylene torch to cut parts of a combine during patient extrication?", "answer": "The combine and surrounding soil should be washed down and the inside of the combine flushed first to reduce the risk of fire.", "category": "Rescue & Extrication"}, {"id": "q_0143_1", "question": "Why should an acetylene torch never be used to disassemble a hay baler during a rescue?", "answer": "Combustible dust inside the baler may ignite if an acetylene torch is used.", "category": "Rescue & Extrication"}, {"id": "q_0143_2", "question": "What is the primary function of a grain auger on a farm?", "answer": "A grain auger is a long tube used to raise and transport grain from the ground to grain bins, load trucks, or carry feed to cattle feeders; it uses a screw-shaped shank that moves grain upward as it turns.", "category": "Workplace Health & Safety"}, {"id": "q_0143_3", "question": "What is the most common injury associated with grain auger operation?", "answer": "Amputation, caused by contact with or entanglement in the exposed screw at the intake end of the auger's shaft.", "category": "Workplace Health & Safety"}, {"id": "q_0144_1", "question": "What respiratory equipment must rescuers wear when entering a silo with silo gas present?", "answer": "Rescuers must wear a self-contained breathing apparatus (SCBA) to rescue a patient in the presence of silo gas.", "category": "Rescue & Extrication"}, {"id": "q_0144_2", "question": "What are four signs that dangerous silo gas is present?", "answer": "Signs include a bleach-like smell, the presence of dead birds and insects, a yellowish or reddish vapour, and sick livestock nearby.", "category": "Workplace Health & Safety"}, {"id": "q_0144_3", "question": "What decontamination steps must be taken before transporting a patient rescued from a manure storage area?", "answer": "Remove any contaminated clothing and flush the patient's body with water; do not bring contaminated materials into the transport vehicle, and anyone and everything that contacted manure requires decontamination.", "category": "Workplace Health & Safety"}, {"id": "q_0145_1", "question": "What are identified as the main causes of livestock-related accidents on farms?", "answer": "Poor judgment and lack of understanding of animal behaviour are the main causes of accidents involving livestock.", "category": "Workplace Health & Safety"}, {"id": "q_0145_2", "question": "What special characteristics of livestock must be understood before handling them?", "answer": "Livestock have unique vision characteristics, sensitivity to noise, and strong territorial instincts that must be understood before handling.", "category": "Workplace Health & Safety"}, {"id": "q_0145_3", "question": "What additional step should be taken when treating a wound inflicted by a farm animal?", "answer": "Any wound from a livestock injury should be flushed of animal feces in addition to standard wound treatment.", "category": "Wound & Soft-Tissue Care"}];

const $ = (id) => document.getElementById(id);

const screens = {
  setup:  $('screen-setup'),
  review: $('screen-review'),
  score:  $('screen-score'),
};
function show(name) {
  for (const k of Object.keys(screens)) screens[k].classList.toggle('active', k === name);
}

const state = {
  selected: new Set(),
  cards: [],
  index: 0,
  results: [],
};

function categoryCounts(data) {
  const counts = {};
  for (const c of data) counts[c.category] = (counts[c.category] || 0) + 1;
  return counts;
}

function renderChips() {
  const counts = categoryCounts(FLASHCARDS_DATA);
  const chipsEl = $('chips');
  chipsEl.innerHTML = '';
  for (const cat of Object.keys(counts).sort()) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'chip' + (state.selected.has(cat) ? ' on' : '');
    btn.innerHTML = `${cat}<span class="count">${counts[cat]}</span>`;
    btn.addEventListener('click', () => {
      if (state.selected.has(cat)) state.selected.delete(cat);
      else state.selected.add(cat);
      renderChips();
      syncCountDefault();
    });
    chipsEl.appendChild(btn);
  }
}

function availableInSelection() {
  return FLASHCARDS_DATA.filter((c) => state.selected.has(c.category)).length;
}

function syncCountDefault() {
  const input = $('count-input');
  const avail = availableInSelection();
  input.max = String(avail);
  if (!input.dataset.userTouched) input.value = String(avail);
  $('start-btn').disabled = avail === 0 || Number(input.value) <= 0;
}

function startReview() {
  const requested = Math.max(1, Math.min(availableInSelection(), Number($('count-input').value) || 0));
  const selectedCats = [...state.selected];
  const sampled = stratifiedSample(FLASHCARDS_DATA, requested, selectedCats);
  state.cards = shuffle(sampled, Math.random);
  state.index = 0;
  state.results = [];
  show('review');
  renderCard();
}

function renderCard() {
  const card = state.cards[state.index];
  $('progress').textContent = `Card ${state.index + 1} of ${state.cards.length}`;
  $('question').textContent = card.question;
  $('answer-text').textContent = card.answer;
  $('answer-category').textContent = card.category;
  $('answer-block').hidden = true;
  $('rate-row').hidden = true;
  $('reveal-row').hidden = false;
}

function reveal() {
  $('answer-block').hidden = false;
  $('reveal-row').hidden = true;
  $('rate-row').hidden = false;
}

function rate(correct) {
  const card = state.cards[state.index];
  state.results.push({ category: card.category, correct });
  state.index += 1;
  if (state.index >= state.cards.length) finish();
  else renderCard();
}

function finish() {
  const summary = scoreSummary(state.results);
  $('score-total').textContent = `${summary.total.correct} / ${summary.total.total} correct`;
  const bd = $('score-breakdown');
  bd.innerHTML = '';
  for (const cat of Object.keys(summary.byCategory).sort()) {
    const slot = summary.byCategory[cat];
    const row = document.createElement('div');
    row.className = 'score-row';
    row.innerHTML = `<span>${cat}</span><span class="pct">${slot.correct} / ${slot.total}</span>`;
    bd.appendChild(row);
  }
  show('score');
}

function restart() {
  $('count-input').dataset.userTouched = '';
  state.selected = new Set(Object.keys(categoryCounts(FLASHCARDS_DATA)));
  renderChips();
  syncCountDefault();
  show('setup');
}

$('count-input').addEventListener('input', () => {
  $('count-input').dataset.userTouched = '1';
  $('start-btn').disabled = availableInSelection() === 0 || Number($('count-input').value) <= 0;
});
$('start-btn').addEventListener('click', startReview);
$('reveal-btn').addEventListener('click', reveal);
$('good-btn').addEventListener('click', () => rate(true));
$('bad-btn').addEventListener('click', () => rate(false));
$('restart-btn').addEventListener('click', restart);

state.selected = new Set(Object.keys(categoryCounts(FLASHCARDS_DATA)));
renderChips();
syncCountDefault();
</script>
</body>
</html>
